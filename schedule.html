
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Wedding Event Schedule ✨</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
}

button {
    cursor: pointer;
    font: inherit;
}

/* Transparent AR rendering */
#ar-scene,
.a-canvas {
    background: transparent !important;
}

/* Camera status */
#status {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;

    max-width: 94vw;
    padding: 11px 16px;

    background: rgba(20,0,30,0.9);
    border: 1px solid #ffd700;
    border-radius: 12px;

    color: #ffd700;
    font-size: 12px;
    text-align: center;
    pointer-events: none;
}

#dot {
    display: inline-block;
    height: 9px;
    width: 9px;
    margin-right: 6px;
    border-radius: 50%;
    background: orange;
}

#dot.active {
    background: #00ff88;
}

/* Controls */
#controls {
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);

    width: min(96%, 460px);
    z-index: 1200;

    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.btn {
    padding: 11px 14px;
    min-height: 44px;

    border: 1px solid #ffd700;
    border-radius: 11px;

    background: rgba(25,0,35,0.94);
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.btn.primary {
    background: linear-gradient(135deg,#ff69b4,#b82c68);
    border-color: #ffb6c1;
}

/* Schedule popup */
#schedule-panel {
    position: fixed;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 1300;
    display: none;

    width: min(92vw,390px);
    max-height: 60vh;
    overflow-y: auto;

    padding: 20px;
    border: 1px solid #ffd700;
    border-radius: 18px;

    background: rgba(24,0,34,0.97);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

#schedule-panel h2 {
    color: #ffd700;
    text-align: center;
    margin-top: 0;
}

.event {
    padding: 12px 4px;
    border-bottom: 1px solid rgba(255,215,0,0.3);
}

.event:last-child {
    border-bottom: none;
}

.event-time {
    color: #ffb6c1;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

.event-name {
    font-size: 14px;
}

/* Measurements */
#metrics {
    display: none;
    position: fixed;
    top: 105px;
    left: 12px;
    z-index: 1150;

    padding: 12px;
    border: 1px solid #ffd700;
    border-radius: 10px;

    background: rgba(0,0,0,0.85);
    font: 11px/1.8 monospace;
}

#metrics.visible {
    display: block;
}

/* Messages */
#toast {
    display: none;
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 1800;
    width: min(92vw,360px);
    padding: 12px;

    border-radius: 10px;
    background: rgba(0,0,0,0.9);

    font-size: 12px;
    text-align: center;
    pointer-events: none;
}

@media(max-width:420px) {
    .btn {
        padding: 9px 11px;
        font-size: 11px;
    }

    #schedule-panel {
        bottom: 110px;
    }
}
</style>
</head>

<body>

<!-- STATUS -->
<div id="status">
    <span id="dot"></span>
    <span id="status-text">
        Initializing AR camera...
    </span>
</div>

<!-- SCHEDULE POPUP -->
<div id="schedule-panel">

    <h2>💍 Wedding Schedule</h2>

    <div class="event">
        <div class="event-time">10:30 AM</div>
        <div class="event-name">🌼 Haldi Ceremony</div>
    </div>

    <div class="event">
        <div class="event-time">04:00 PM</div>
        <div class="event-name">🥁 Baraat &amp; Swagat</div>
    </div>

    <div class="event">
        <div class="event-time">06:30 PM</div>
        <div class="event-name">💍 Shubh Vivah</div>
    </div>

    <div class="event">
        <div class="event-time">08:30 PM</div>
        <div class="event-name">🎶 Dinner &amp; Sangeet</div>
    </div>

    <button
        class="btn primary"
        style="display:block;margin:16px auto 0"
        onclick="toggleSchedule()">
        Close
    </button>

</div>

<!-- METRICS -->
<div id="metrics">
    <div>Camera: <span id="camera-state">WAITING</span></div>
    <div>Camera resolution: <span id="camera-resolution">--</span></div>
    <div>Marker detections: <span id="detections">0</span></div>
    <div>Tracking losses: <span id="losses">0</span></div>
    <div>Visible time: <span id="visible-time">0.0</span>s</div>
    <div>First detection: <span id="first-time">--</span></div>
    <div>Animation FPS: <span id="fps">--</span></div>
</div>

<div id="toast"></div>

<!-- CONTROLS -->
<div id="controls">

    <button class="btn primary" onclick="toggleSchedule()">
        📅 Event Schedule
    </button>

    <button class="btn" onclick="toggleMetrics()">
        📊 Metrics
    </button>

</div>

<!-- AR SCENE -->
<a-scene
    id="ar-scene"
    embedded
    arjs="sourceType: webcam;
          sourceWidth: 1280;
          sourceHeight: 720;
          displayWidth: 1280;
          displayHeight: 720;
          debugUIEnabled: false;"
    renderer="alpha: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- IMAGE ASSETS -->
    <a-assets timeout="15000">

        <img id="hallEnv" src="Back.png">
        <img id="archBoard" src="Display.png">
        <img id="wood" src="texture.jpg">

        <img id="g_bride" src="Bride.png">
        <img id="g_barat" src="Barat.png">
        <img id="g_sanget" src="Sangeet.png">

        <a-mixin
            id="sparkle"
            geometry="primitive: sphere; radius: 0.015"
            material="shader: flat; transparent: true; opacity: 0.8">
        </a-mixin>

    </a-assets>

    <!-- HIRO MARKER -->
    <a-marker
        id="hiro-marker"
        preset="hiro"
        emitevents="true"
        smooth="true"
        smooth-count="5"
        smooth-tolerance="0.01"
        smooth-threshold="2">

        <!-- WOODEN FLOOR -->
        <a-circle
            rotation="-90 0 0"
            radius="1.3"
            position="0 0.01 0"
            material="src: #wood;
                      roughness: 1;
                      side: double">
        </a-circle>

        <!-- BACKGROUND -->
        <a-entity
            geometry="primitive: cylinder;
                      radius: 1.6;
                      height: 2;
                      thetaStart: 120;
                      thetaLength: 120;
                      openEnded: true"
            material="src: #hallEnv;
                      side: back;
                      shader: flat"
            position="0 0 -0.75">
        </a-entity>

        <!-- MAIN EVENT BOARD -->
        <a-entity position="0 0.9 -0.4">

            <a-entity
                id="board-ui"
                position="-0.4 0 0"
                rotation="0 8 0">

                <a-plane
                    src="#archBoard"
                    width="1"
                    height="1.7"
                    material="transparent: true;
                              alphaTest: 0.5;
                              shader: flat;
                              side: double">
                </a-plane>

                <!-- BOARD CONTENT -->
                <a-entity position="0 0 0.12">

                    <a-text
                        value="THE WEDDING SCHEDULE"
                        position="0 0.7 0"
                        align="center"
                        color="#000000"
                        width="1.8">
                    </a-text>

                    <!-- HALDI -->
                    <a-entity position="-0.3 0.4 0">

                        <a-text
                            value="10:30 AM"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                        <a-text
                            value="HALDI CEREMONY"
                            position="0 -0.12 0.02"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                    </a-entity>

                    <!-- BARAAT -->
                    <a-entity position="-0.3 0.1 0">

                        <a-text
                            value="04:00 PM"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                        <a-text
                            value="BARAAT &amp; SWAGAT"
                            position="0 -0.12 0.02"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                    </a-entity>

                    <!-- SHUBH VIVAH -->
                    <a-entity position="-0.3 -0.2 0">

                        <a-text
                            value="06:30 PM"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                        <a-text
                            value="SHUBH VIVAH"
                            position="0 -0.12 0.02"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                    </a-entity>

                    <!-- DINNER AND SANGEET -->
                    <a-entity position="-0.3 -0.5 0">

                        <a-text
                            value="08:30 PM"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                        <a-text
                            value="DINNER &amp; SANGEET"
                            position="0 -0.12 0.02"
                            color="#000000"
                            width="2"
                            align="left">
                        </a-text>

                    </a-entity>

                </a-entity>

            </a-entity>

            <!-- WEDDING GALLERY -->
            <a-entity
                id="gallery"
                position="0.5 0 0"
                rotation="0 -10 0">

                <a-plane
                    src="#g_bride"
                    width="0.35"
                    height="0.45"
                    position="-0.1 0.3 0.05"
                    rotation="0 0 -5"
                    material="shader: flat; side: double">
                </a-plane>

                <a-plane
                    src="#g_barat"
                    width="0.35"
                    height="0.45"
                    position="0.1 0 0.08"
                    rotation="0 0 5"
                    material="shader: flat; side: double">
                </a-plane>

                <a-plane
                    src="#g_sanget"
                    width="0.35"
                    height="0.45"
                    position="-0.05 -0.3 0.05"
                    rotation="0 0 8"
                    material="shader: flat; side: double">
                </a-plane>

            </a-entity>

        </a-entity>

        <!-- SPARKLE ANIMATIONS -->
        <a-entity id="sparkle-layer">

            <a-entity
                mixin="sparkle"
                material="color: #FFD700; shader: flat; opacity: 0.8"
                position="-0.4 1.2 0.3"
                animation="property: position;
                           from: -0.4 1.2 0.3;
                           to: -0.4 1.5 0.3;
                           dur: 3000;
                           dir: alternate;
                           loop: true">
            </a-entity>

            <a-entity
                mixin="sparkle"
                material="color: #FFFFFF; shader: flat; opacity: 0.8"
                position="0.5 0.9 0.4"
                animation="property: scale;
                           from: 1 1 1;
                           to: 0.3 0.3 0.3;
                           dur: 1200;
                           dir: alternate;
                           loop: true">
            </a-entity>

        </a-entity>

        <!-- LIGHTING -->
        <a-light
            type="ambient"
            intensity="1.4"
            color="#FFF5CC">
        </a-light>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>
"use strict";

const $ = id => document.getElementById(id);

const state = {
    cameraReady: false,
    markerVisible: false,
    detections: 0,
    losses: 0,
    visibleSince: null,
    visibleMs: 0,
    firstDetection: null,
    startTime: performance.now(),
    fps: 0
};

let toastTimer = null;

/* NOTIFICATIONS */
function notify(message, duration = 3500) {
    const box = $("toast");

    box.textContent = message;
    box.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        box.style.display = "none";
    }, duration);
}

/* CAMERA / MARKER STATUS */
function setStatus(message, active = false) {
    $("status-text").textContent = message;
    $("dot").classList.toggle("active", active);
}

/* SCHEDULE POPUP */
function toggleSchedule() {
    const panel = $("schedule-panel");

    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}

/* METRICS POPUP */
function toggleMetrics() {
    $("metrics").classList.toggle("visible");
    updateMetrics();
}

/* FIND AR.JS VIDEO */
function getCameraVideo() {
    const videos = Array.from(
        document.querySelectorAll("video")
    );

    return videos.find(video =>
        video.id === "arjs-video" &&
        video.videoWidth > 0
    ) || videos.find(video =>
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) || null;
}

/* CAMERA READY CHECK */
function checkCamera() {
    const video = getCameraVideo();

    if (!video) return false;

    if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
    ) {
        state.cameraReady = true;

        $("camera-state").textContent = "ON";

        $("camera-resolution").textContent =
            video.videoWidth + " × " + video.videoHeight;

        if (!state.markerVisible) {
            setStatus("Camera ready — scan Hiro marker");
        }

        return true;
    }

    return false;
}

/* CAMERA MONITOR */
function monitorCamera() {
    let attempts = 0;

    const timer = setInterval(() => {
        attempts++;

        if (checkCamera()) {
            clearInterval(timer);
            return;
        }

        if (attempts >= 30) {
            clearInterval(timer);

            setStatus("Camera unavailable");

            notify(
                "Check HTTPS and camera permissions.",
                7000
            );
        }
    }, 500);
}

/* MARKER EVENTS */
function setupMarker() {
    const marker = $("hiro-marker");

    marker.addEventListener("markerFound", () => {
        if (state.markerVisible) return;

        const now = performance.now();

        state.markerVisible = true;
        state.detections++;
        state.visibleSince = now;

        if (state.firstDetection === null) {
            state.firstDetection = now - state.startTime;
        }

        setStatus(
            "Hiro marker detected — Schedule active",
            true
        );

        updateMetrics();
    });

    marker.addEventListener("markerLost", () => {
        if (!state.markerVisible) return;

        if (state.visibleSince !== null) {
            state.visibleMs +=
                performance.now() - state.visibleSince;
        }

        state.visibleSince = null;
        state.markerVisible = false;
        state.losses++;

        setStatus(
            "Marker lost — scan Hiro marker"
        );

        updateMetrics();
    });
}

/* MARKER VISIBLE DURATION */
function markerVisibleTime() {
    let total = state.visibleMs;

    if (
        state.markerVisible &&
        state.visibleSince !== null
    ) {
        total +=
            performance.now() - state.visibleSince;
    }

    return total;
}

/* UPDATE METRICS */
function updateMetrics() {
    $("detections").textContent = state.detections;
    $("losses").textContent = state.losses;

    $("visible-time").textContent =
        (markerVisibleTime() / 1000).toFixed(1);

    $("first-time").textContent =
        state.firstDetection === null
        ? "--"
        : (state.firstDetection / 1000).toFixed(2) + "s";

    $("fps").textContent =
        state.fps > 0
        ? state.fps.toFixed(1)
        : "--";

    $("camera-state").textContent =
        state.cameraReady ? "ON" : "WAITING";
}

/* BROWSER ANIMATION-FRAME RATE */
function startFPS() {
    let frames = 0;
    let last = performance.now();
    let running = false;

    function measure(now) {
        if (document.hidden) {
            running = false;
            return;
        }

        frames++;

        if (now - last >= 1000) {
            state.fps =
                frames * 1000 / (now - last);

            frames = 0;
            last = now;

            updateMetrics();
        }

        requestAnimationFrame(measure);
    }

    function resume() {
        if (!document.hidden && !running) {
            running = true;
            frames = 0;
            last = performance.now();
            requestAnimationFrame(measure);
        }
    }

    document.addEventListener(
        "visibilitychange",
        resume
    );

    resume();
}

/* INITIALIZATION */
function initialize() {
    setupMarker();
    startFPS();

    if (!window.isSecureContext) {
        setStatus("HTTPS required");

        notify(
            "Open using HTTPS or localhost.",
            8000
        );

        return;
    }

    window.addEventListener(
        "arjs-video-loaded",
        checkCamera
    );

    window.addEventListener(
        "camera-init",
        checkCamera
    );

    window.addEventListener(
        "camera-error",
        error => {
            console.error(
                "Camera error:",
                error
            );

            setStatus("Camera error");

            notify(
                "Unable to initialize camera.",
                7000
            );
        }
    );

    $("ar-scene").addEventListener(
        "asset-error",
        event => {
            console.error(
                "Asset loading error:",
                event.detail
            );

            notify(
                "An image asset could not load."
            );
        }
    );

    monitorCamera();
    updateMetrics();
}

if (document.readyState === "loading") {
    document.addEventListener(
        "DOMContentLoaded",
        initialize
    );
} else {
    initialize();
}
</script>

</body>
</html>
