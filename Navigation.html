
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Navigation</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>

<style>
:root {
    --accent: #00ffe7;
    --orange: #ff6a00;
    --panel: rgba(0, 10, 20, 0.83);
    --border: 1px solid rgba(0,255,231,0.35);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

/* AR CAMERA */

#arScene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: transparent !important;
}

/*
IMPORTANT:
Do not force CSS width, height or object-fit
onto the AR.js camera video element.
AR.js manages camera positioning itself.
*/

/* HUD */

#hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

/* TOP STATUS */

#topbar {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: var(--border);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 96vw;
}

.status {
    text-align: center;
}

.status-label {
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 1px;
}

.status-value {
    font-size: 11px;
    margin-top: 4px;
    white-space: nowrap;
}

#gps-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: orange;
    flex-shrink: 0;
}

#gps-dot.active {
    background: #00ff88;
    box-shadow: 0 0 10px #00ff88;
}

/* COMPASS */

#compass {
    position: absolute;
    top: 90px;
    right: 15px;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: var(--panel);
    border: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
}

#compass-needle {
    width: 5px;
    height: 55px;
    background: linear-gradient(
        to bottom,
        red 50%,
        white 50%
    );
    border-radius: 5px;
    transition: transform 0.2s;
}

#compass-label {
    position: absolute;
    bottom: -18px;
    font-size: 11px;
    color: var(--accent);
}

/* DIRECTION */

#direction-panel {
    position: absolute;
    bottom: 230px;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 390px);
    background: var(--panel);
    border: var(--border);
    border-radius: 12px;
    padding: 14px;
    display: none;
    align-items: center;
    gap: 14px;
}

#direction-arrow {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    transition: transform 0.3s;
}

#direction-text {
    font-size: 18px;
    font-weight: bold;
    line-height: 1.3;
}

#direction-distance {
    font-size: 13px;
    color: var(--accent);
    margin-top: 5px;
}

/* MINI MAP */

#map-container {
    position: absolute;
    bottom: max(15px, env(safe-area-inset-bottom));
    right: 15px;
    width: 180px;
    height: 180px;
    background: #111;
    border: var(--border);
    border-radius: 12px;
    overflow: hidden;
    pointer-events: auto;
}

#map {
    width: 100%;
    height: 100%;
}

#map-title {
    position: absolute;
    top: 5px;
    left: 8px;
    z-index: 2;
    background: var(--panel);
    color: var(--accent);
    padding: 4px;
    font-size: 10px;
}

/* DISTANCE AND ETA */

#stats {
    position: absolute;
    bottom: max(15px, env(safe-area-inset-bottom));
    left: 15px;
    background: var(--panel);
    border: var(--border);
    border-radius: 10px;
    padding: 15px;
    display: none;
}

.stat-title {
    color: var(--accent);
    font-size: 10px;
    margin-bottom: 5px;
}

.stat-value {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.stat-value:last-child {
    margin-bottom: 0;
}

/* START BUTTON */

#startBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 25px;
    background: rgba(0,0,0,0.85);
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
}

/* LOADING */

#loading {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85);
    padding: 20px;
    border-radius: 12px;
    color: var(--accent);
    text-align: center;
    font-size: 14px;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 3px solid #333;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ROUTE STEPS */

#stepsBtn {
    position: absolute;
    top: 90px;
    left: 15px;
    background: var(--panel);
    border: var(--border);
    color: var(--accent);
    padding: 10px;
    border-radius: 8px;
    pointer-events: auto;
    cursor: pointer;
    display: none;
}

#steps-container {
    position: absolute;
    top: 132px;
    left: 15px;
    width: min(250px, 70vw);
    max-height: 38vh;
    overflow-y: auto;
    background: rgba(0,0,0,0.88);
    border: var(--border);
    border-radius: 8px;
    display: none;
    pointer-events: auto;
}

.route-step {
    padding: 10px;
    font-size: 12px;
    border-bottom: 1px solid #333;
    line-height: 1.4;
}

.route-step.active {
    color: var(--accent);
    background: rgba(0,255,231,0.1);
}

/* VOICE NOTIFICATION */

#voice-toast {
    position: absolute;
    top: 150px;
    left: 15px;
    max-width: 230px;
    background: var(--panel);
    border-left: 3px solid var(--orange);
    padding: 12px;
    border-radius: 5px;
    font-size: 13px;
    display: none;
}

/* BACK BUTTON */

#backBtn {
    position: absolute;
    bottom: 210px;
    left: 15px;
    padding: 10px 15px;
    background: var(--panel);
    color: var(--accent);
    border: var(--border);
    border-radius: 8px;
    pointer-events: auto;
    cursor: pointer;
}

/* MOBILE */

@media (max-width: 600px) {

    #topbar {
        gap: 7px;
        padding: 8px;
    }

    .status-label {
        font-size: 8px;
    }

    .status-value {
        font-size: 9px;
    }

    #compass {
        width: 55px;
        height: 55px;
        top: 80px;
    }

    #compass-needle {
        height: 40px;
    }

    #map-container {
        width: 130px;
        height: 130px;
        right: 10px;
        bottom: 12px;
    }

    #stats {
        left: 10px;
        bottom: 12px;
        padding: 10px;
    }

    .stat-value {
        font-size: 14px;
    }

    #direction-panel {
        bottom: 170px;
        padding: 10px;
    }

    #direction-text {
        font-size: 15px;
    }

    #backBtn {
        bottom: 145px;
        left: 10px;
        font-size: 11px;
    }

    #stepsBtn {
        left: 10px;
        top: 80px;
    }

    #steps-container {
        left: 10px;
        top: 125px;
    }

    #voice-toast {
        top: 150px;
        left: 10px;
        max-width: 180px;
    }
}
</style>
</head>

<body>

<!-- AR CAMERA SCENE -->

<a-scene
    id="arScene"
    embedded
    arjs="sourceType: webcam;
          debugUIEnabled: false;"
    renderer="alpha: true; antialias: true"
    vr-mode-ui="enabled: false">

    <a-camera
        id="arCamera"
        gps-camera
        rotation-reader>
    </a-camera>

</a-scene>

<!-- HUD -->

<div id="hud">

    <!-- TOP STATUS -->

    <div id="topbar">

        <div id="gps-dot"></div>

        <div class="status">
            <div class="status-label">GPS</div>
            <div class="status-value" id="gps-value">--</div>
        </div>

        <div class="status">
            <div class="status-label">HEADING</div>
            <div class="status-value" id="heading-value">--°</div>
        </div>

        <div class="status">
            <div class="status-label">ACCURACY</div>
            <div class="status-value" id="accuracy-value">--m</div>
        </div>

    </div>

    <!-- COMPASS -->

    <div id="compass">

        <div id="compass-needle"></div>
        <div id="compass-label">N</div>

    </div>

    <!-- DIRECTION -->

    <div id="direction-panel">

        <svg
            id="direction-arrow"
            viewBox="0 0 44 44"
            fill="none">

            <polygon
                id="arrow-poly"
                points="22,4 38,36 22,28 6,36"
                fill="#00ffe7">
            </polygon>

        </svg>

        <div>
            <div id="direction-text">
                Finding route...
            </div>

            <div id="direction-distance"></div>
        </div>

    </div>

    <!-- ROUTE STEPS -->

    <button id="stepsBtn" onclick="toggleSteps()">
        ▼ ROUTE STEPS
    </button>

    <div id="steps-container">
        <div id="steps-list"></div>
    </div>

    <!-- STATS -->

    <div id="stats">

        <div class="stat-title">DISTANCE LEFT</div>
        <div class="stat-value" id="distance-left">--</div>

        <div class="stat-title">ESTIMATED TIME</div>
        <div class="stat-value" id="eta">--</div>

    </div>

    <!-- MINI MAP -->

    <div id="map-container">

        <div id="map-title">MINI MAP</div>
        <div id="map"></div>

    </div>

    <!-- START -->

    <button id="startBtn" onclick="startAR()">
        ◉ START AR NAV
    </button>

    <!-- LOADING -->

    <div id="loading">
        <div class="spinner"></div>
        ACQUIRING GPS...
    </div>

    <!-- VOICE TOAST -->

    <div id="voice-toast"></div>

    <!-- BACK -->

    <button id="backBtn" onclick="goHome()">
        ← BACK
    </button>

</div>

<script>

/* CONFIGURATION */

const DESTINATION = "Vellore Institute of Technology";
const WAYPOINT_RADIUS = 15;
const MAX_GPS_ACCURACY = 30;
const VOICE_AHEAD_DISTANCE = 40;

/* VARIABLES */

let map;
let directionsService;
let directionsRenderer;
let userMarker;

let routeSteps = [];
let currentStep = 0;

let userLat = 0;
let userLng = 0;
let deviceHeading = 0;
let headingAvailable = false;

let watchId = null;
let navigating = false;
let lastVoiceStep = -1;
let compassInitialized = false;

let arObjects = [];
let toastTimeout;

/* HELPERS */

function $(id) {
    return document.getElementById(id);
}

function toRad(value) {
    return value * Math.PI / 180;
}

function toDeg(value) {
    return value * 180 / Math.PI;
}

function formatDistance(meters) {
    if (meters >= 1000) {
        return (meters / 1000).toFixed(1) + " km";
    }

    return Math.round(meters) + " m";
}

/* LOCATION DISTANCE */

function haversine(lat1, lng1, lat2, lng2) {

    const R = 6371000;

    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) ** 2;

    return 2 * R * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

/* BEARING */

function getBearing(lat1, lng1, lat2, lng2) {

    const dLng = toRad(lng2 - lng1);

    const y =
        Math.sin(dLng) * Math.cos(toRad(lat2));

    const x =
        Math.cos(toRad(lat1)) *
        Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.cos(dLng);

    return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

/* START AR */

async function startAR() {

    $("startBtn").style.display = "none";
    $("loading").style.display = "block";

    if (!window.isSecureContext) {
        alert("Please open this website using HTTPS.");
        resetStart();
        return;
    }

    if (!navigator.geolocation) {
        alert("Your browser does not support GPS.");
        resetStart();
        return;
    }

    if (!window.google || !google.maps) {
        alert("Google Maps failed to load. Check your API key.");
        resetStart();
        return;
    }

    /* iPhone compass permission */

    if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
        try {
            await DeviceOrientationEvent.requestPermission();
        } catch (error) {
            console.warn("Orientation permission:", error);
        }
    }

    navigator.geolocation.getCurrentPosition(
        createNavigation,
        function(error) {
            alert("GPS Error: " + error.message);
            resetStart();
        },
        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }
    );
}

/* RESET */

function resetStart() {
    $("loading").style.display = "none";
    $("startBtn").style.display = "block";
}

/* CREATE NAVIGATION */

function createNavigation(position) {

    userLat = position.coords.latitude;
    userLng = position.coords.longitude;

    updateGPSDisplay(position);

    const origin = {
        lat: userLat,
        lng: userLng
    };

    map = new google.maps.Map($("map"), {
        center: origin,
        zoom: 17,
        disableDefaultUI: true
    });

    userMarker = new google.maps.Marker({
        position: origin,
        map: map,
        icon: {
            path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
            scale: 5,
            fillColor: "#00ffe7",
            fillOpacity: 1,
            strokeColor: "#ffffff",
            strokeWeight: 1,
            rotation: 0
        }
    });

    directionsService =
        new google.maps.DirectionsService();

    directionsRenderer =
        new google.maps.DirectionsRenderer({
            suppressMarkers: false,
            polylineOptions: {
                strokeColor: "#00ffe7",
                strokeWeight: 4
            }
        });

    directionsRenderer.setMap(map);

    directionsService.route({

        origin: origin,
        destination: DESTINATION,
        travelMode: google.maps.TravelMode.WALKING

    }, function(result, status) {

        if (status === "OK") {

            directionsRenderer.setDirections(result);

            processRoute(result);

            if (!routeSteps.length) {
                alert("No walking route found.");
                resetStart();
                return;
            }

            $("loading").style.display = "none";
            $("direction-panel").style.display = "flex";
            $("stats").style.display = "block";
            $("stepsBtn").style.display = "block";

            navigating = true;

            setupCompass();
            startTracking();
            updateDirection();

        } else {

            alert("Unable to calculate route: " + status);
            resetStart();

        }
    });
}

/* PROCESS ROUTE */

function processRoute(result) {

    const leg = result.routes[0].legs[0];

    routeSteps = leg.steps.map(function(step, index) {

        return {
            index: index,
            instruction: stripHTML(step.instructions),
            maneuver: step.maneuver || "",
            lat: step.end_location.lat(),
            lng: step.end_location.lng(),
            startLat: step.start_location.lat(),
            startLng: step.start_location.lng(),
            distance: step.distance.value,
            duration: step.duration.value
        };
    });

    currentStep = 0;
    lastVoiceStep = -1;

    $("distance-left").textContent =
        leg.distance.text;

    $("eta").textContent =
        leg.duration.text;

    createRouteList();

    placeARArrows(routeSteps.slice(0, 8));

    if (routeSteps.length > 0) {

        updateInstruction();

        speak(
            "Navigation started. " +
            routeSteps[0].instruction
        );
    }
}

/* REMOVE HTML */

function stripHTML(html) {

    const element = document.createElement("div");

    element.innerHTML = html;

    return element.textContent || "";
}

/* ROUTE LIST */

function createRouteList() {

    const list = $("steps-list");

    list.innerHTML = "";

    routeSteps.forEach(function(step, index) {

        const item = document.createElement("div");

        item.className =
            "route-step" + (index === 0 ? " active" : "");

        item.id = "route-" + index;

        item.textContent =
            (index + 1) + ". " + step.instruction;

        list.appendChild(item);
    });
}

/* AR ARROWS */

function placeARArrows(steps) {

    const scene = $("arScene");

    arObjects.forEach(function(object) {

        if (object.parentNode) {
            object.parentNode.removeChild(object);
        }
    });

    arObjects = [];

    steps.forEach(function(step, index) {

        const group = document.createElement("a-entity");

        group.setAttribute(
            "gps-entity-place",
            "latitude: " + step.lat +
            "; longitude: " + step.lng
        );

        group.setAttribute("position", "0 2.5 0");

        const bearing = getBearing(
            step.startLat,
            step.startLng,
            step.lat,
            step.lng
        );

        group.setAttribute(
            "rotation",
            "0 " + (-bearing) + " 0"
        );

        /* Arrow body */

        const body = document.createElement("a-box");

        body.setAttribute("width", "0.45");
        body.setAttribute("height", "0.15");
        body.setAttribute("depth", "1.5");
        body.setAttribute("position", "0 0 -0.25");
        body.setAttribute("color",
            index === 0 ? "#00ffe7" : "#ff6a00"
        );
        body.setAttribute("opacity", "0.9");

        /* Arrow head */

        const head = document.createElement("a-cone");

        head.setAttribute("radius-bottom", "0.5");
        head.setAttribute("radius-top", "0");
        head.setAttribute("height", "0.85");
        head.setAttribute("rotation", "-90 0 0");
        head.setAttribute("position", "0 0 -1.4");
        head.setAttribute("color",
            index === 0 ? "#00ffe7" : "#ff6a00"
        );

        /* Number */

        const label = document.createElement("a-text");

        label.setAttribute(
            "value",
            String(index + 1)
        );

        label.setAttribute("align", "center");
        label.setAttribute("color", "#ffffff");
        label.setAttribute("scale", "2 2 2");
        label.setAttribute("position", "0 1 0");
        label.setAttribute("side", "double");

        /* Pole */

        const pole = document.createElement("a-cylinder");

        pole.setAttribute("radius", "0.04");
        pole.setAttribute("height", "2");
        pole.setAttribute("color", "#00ffe7");
        pole.setAttribute("opacity", "0.5");
        pole.setAttribute("position", "0 -1 0");

        group.appendChild(body);
        group.appendChild(head);
        group.appendChild(label);
        group.appendChild(pole);

        group.setAttribute(
            "animation__bob",
            "property: position; " +
            "from: 0 2.5 0; " +
            "to: 0 3.1 0; " +
            "dir: alternate; " +
            "loop: true; " +
            "dur: 1800"
        );

        scene.appendChild(group);

        arObjects.push(group);
    });
}

/* GPS TRACKING */

function startTracking() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    watchId = navigator.geolocation.watchPosition(
        updateLocation,

        function(error) {
            console.warn("GPS error:", error.message);
        },

        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 15000
        }
    );
}

/* UPDATE LOCATION */

function updateLocation(position) {

    userLat = position.coords.latitude;
    userLng = position.coords.longitude;

    updateGPSDisplay(position);

    const location = {
        lat: userLat,
        lng: userLng
    };

    if (userMarker) {
        userMarker.setPosition(location);
    }

    if (map) {
        map.panTo(location);
    }

    updateDirection();

    if (
        position.coords.accuracy <= MAX_GPS_ACCURACY
    ) {
        updateStepProgress();
    }

    updateRemainingDistance();
}

/* GPS STATUS */

function updateGPSDisplay(position) {

    $("gps-value").textContent =
        position.coords.latitude.toFixed(4) +
        ", " +
        position.coords.longitude.toFixed(4);

    $("accuracy-value").textContent =
        Math.round(position.coords.accuracy) + "m";

    $("gps-dot").classList.toggle(
        "active",
        position.coords.accuracy <= MAX_GPS_ACCURACY
    );
}

/* WAYPOINT PROGRESS */

function updateStepProgress() {

    if (!navigating) return;

    if (currentStep >= routeSteps.length) return;

    const step = routeSteps[currentStep];

    const distance = haversine(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    if (distance <= WAYPOINT_RADIUS) {

        currentStep++;

        if (currentStep < routeSteps.length) {

            updateInstruction();

            speak(
                routeSteps[currentStep].instruction
            );

            lastVoiceStep = currentStep;

        } else {

            navigating = false;

            $("direction-text").textContent =
                "Destination Reached!";

            $("direction-distance").textContent = "";

            speak(
                "You have arrived at your destination."
            );

            if (watchId !== null) {

                navigator.geolocation.clearWatch(watchId);

                watchId = null;
            }
        }

        return;
    }

    if (
        distance < VOICE_AHEAD_DISTANCE &&
        currentStep !== lastVoiceStep
    ) {

        speak(
            "In " +
            formatDistance(distance) +
            ", " +
            step.instruction
        );

        lastVoiceStep = currentStep;
    }
}

/* CURRENT INSTRUCTION */

function updateInstruction() {

    if (currentStep >= routeSteps.length) {
        return;
    }

    const step = routeSteps[currentStep];

    $("direction-text").textContent =
        step.instruction;

    const isTurn =
        /turn|left|right|merge/i.test(
            step.maneuver + " " + step.instruction
        );

    $("arrow-poly").setAttribute(
        "fill",
        isTurn ? "#ff6a00" : "#00ffe7"
    );

    document.querySelectorAll(".route-step").forEach(
        function(item) {
            item.classList.remove("active");
        }
    );

    const active = $("route-" + currentStep);

    if (active) {
        active.classList.add("active");
    }

    updateDirection();
}

/* DIRECTION */

function updateDirection() {

    if (!navigating) return;

    if (currentStep >= routeSteps.length) return;

    const step = routeSteps[currentStep];

    const bearing = getBearing(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    if (headingAvailable) {

        let relative =
            (bearing - deviceHeading + 360) % 360;

        if (relative > 180) {
            relative -= 360;
        }

        $("direction-arrow").style.transform =
            "rotate(" + relative + "deg)";
    }

    const distance = haversine(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    $("direction-distance").textContent =
        formatDistance(distance) +
        " to next point";
}

/* REMAINING DISTANCE */

function updateRemainingDistance() {

    if (!routeSteps.length) return;

    if (currentStep >= routeSteps.length) {

        $("distance-left").textContent = "0 m";
        $("eta").textContent = "0 min";

        return;
    }

    const step = routeSteps[currentStep];

    let remaining = haversine(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    for (
        let i = currentStep + 1;
        i < routeSteps.length;
        i++
    ) {
        remaining += routeSteps[i].distance;
    }

    $("distance-left").textContent =
        formatDistance(remaining);

    const minutes = Math.ceil(
        remaining / 1.3 / 60
    );

    $("eta").textContent =
        minutes + " min";
}

/* COMPASS */

function setupCompass() {

    if (compassInitialized) return;

    compassInitialized = true;

    if ("ondeviceorientationabsolute" in window) {

        window.addEventListener(
            "deviceorientationabsolute",
            updateCompass,
            true
        );

    } else {

        window.addEventListener(
            "deviceorientation",
            updateCompass,
            true
        );
    }
}

function updateCompass(event) {

    let heading = null;

    if (
        typeof event.webkitCompassHeading === "number"
    ) {

        heading = event.webkitCompassHeading;

    } else if (
        event.absolute === true &&
        event.alpha !== null
    ) {

        heading =
            (360 - event.alpha + 360) % 360;

    }

    if (heading === null) return;

    deviceHeading = heading;
    headingAvailable = true;

    $("heading-value").textContent =
        Math.round(heading) + "°";

    $("compass-needle").style.transform =
        "rotate(" + (-heading) + "deg)";

    updateDirection();
}

/* VOICE */

function speak(text) {

    const toast = $("voice-toast");

    toast.textContent = "🔊 " + text;
    toast.style.display = "block";

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(function() {
        toast.style.display = "none";
    }, 4500);

    if (!("speechSynthesis" in window)) return;

    try {

        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = "en-IN";
        utterance.rate = 1;
        utterance.pitch = 1;

        speechSynthesis.speak(utterance);

    } catch (error) {

        console.warn("Voice error:", error);
    }
}

/* ROUTE STEPS TOGGLE */

function toggleSteps() {

    const container = $("steps-container");

    container.style.display =
        container.style.display === "block"
        ? "none"
        : "block";
}

/* BACK TO HOME */

function goHome() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }

    window.location.href = "home.html";
}

/* CLEANUP */

window.addEventListener("pagehide", function() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }
});

</script>
