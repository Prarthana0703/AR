
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Navigation</title>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh_SqXafoV8q-EEXifAaCGqWOeRi50jNA"></script>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
    --hud-bg: rgba(0,10,20,0.82);
    --accent: #00ffe7;
    --accent2: #ff6a00;
    --warn: #ffe600;
    --panel-border: 1px solid rgba(0,255,231,0.22);
    --font-main: 'Rajdhani', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: var(--font-main);
}

/* CAMERA AND AR */
a-scene {
    position: fixed !important;
    inset: 0;
    width: 100vw !important;
    height: 100dvh !important;
    z-index: 1;
}

video,
#arjs-video,
.arjs-video {
    object-fit: contain !important;
}

/* HUD */
#hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

#hud::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,231,0.015) 2px,
        rgba(0,255,231,0.015) 4px
    );
    pointer-events: none;
}

/* CORNERS */
.corner {
    position: absolute;
    width: 30px;
    height: 30px;
}

.corner-tl {
    top: 12px;
    left: 12px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
}

.corner-tr {
    top: 12px;
    right: 12px;
    border-top: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
}

.corner-bl {
    bottom: 12px;
    left: 12px;
    border-bottom: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
}

.corner-br {
    bottom: 12px;
    right: 12px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
}

/* TOP BAR */
#topbar {
    position: absolute;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: var(--hud-bg);
    border: var(--panel-border);
    border-radius: 6px;
    padding: 9px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(8px);
    max-width: calc(100vw - 35px);
}

#topbar .label {
    color: rgba(0,255,231,0.55);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

#topbar .value {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: nowrap;
}

#gps-dot {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 6px var(--warn);
}

#gps-dot.active {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* DIRECTION PANEL */
#direction-panel {
    position: absolute;
    bottom: 230px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--hud-bg);
    border: var(--panel-border);
    border-radius: 8px;
    padding: 12px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    min-width: 240px;
    max-width: min(90vw, 440px);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,255,231,0.08);
}

#dir-arrow-svg {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    transition: transform 0.4s ease;
    filter: drop-shadow(0 0 6px var(--accent));
}

#dir-text {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
}

#dir-dist {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
}

/* COMPASS */
#compass {
    position: absolute;
    top: 85px;
    right: 20px;
    width: 75px;
    height: 75px;
    background: var(--hud-bg);
    border: var(--panel-border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
}

#compass-needle {
    width: 4px;
    height: 55px;
    background: linear-gradient(
        to bottom,
        #ff3b3b 0%,
        #ff3b3b 50%,
        rgba(255,255,255,0.5) 50%
    );
    border-radius: 2px;
    transition: transform 0.25s ease;
}

#compass-label {
    position: absolute;
    bottom: -19px;
    color: var(--accent);
    font-size: 10px;
    letter-spacing: 2px;
}

/* MINI MAP */
#map-container {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    right: 20px;
    width: 180px;
    height: 180px;
    border: var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
    pointer-events: auto;
    box-shadow: 0 0 20px rgba(0,255,231,0.1);
}

#map {
    width: 100%;
    height: 100%;
}

#map-label {
    position: absolute;
    top: 5px;
    left: 8px;
    color: var(--accent);
    font-size: 9px;
    letter-spacing: 2px;
    z-index: 2;
    pointer-events: none;
}

/* VOICE TOAST */
#voice-toast {
    position: absolute;
    top: 130px;
    left: 20px;
    background: var(--hud-bg);
    border: 1px solid rgba(255,106,0,0.3);
    border-left: 3px solid var(--accent2);
    border-radius: 4px;
    padding: 10px 16px;
    max-width: 220px;
    opacity: 0;
    transform: translateX(-10px);
    transition: all 0.35s ease;
}

#voice-toast.show {
    opacity: 1;
    transform: translateX(0);
}

#voice-text {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
}

/* STATS */
#stats-panel {
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 20px;
    background: var(--hud-bg);
    border: var(--panel-border);
    border-radius: 6px;
    padding: 12px 16px;
    backdrop-filter: blur(8px);
}

.stat-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 9px;
}

.stat-row:last-child {
    margin-bottom: 0;
}

.stat-label {
    color: rgba(0,255,231,0.55);
    font-size: 9px;
    letter-spacing: 1px;
}

.stat-val {
    color: #fff;
    font-family: var(--font-mono);
    font-size: 15px;
}

/* START BUTTON */
#startBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,10,20,0.85);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-main);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 16px 30px;
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
}

#startBtn:active {
    transform: translate(-50%, -50%) scale(0.97);
}

#loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 2px;
    display: none;
    text-align: center;
    width: 90%;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 2px solid rgba(0,255,231,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ROUTE STEPS */
#steps-toggle {
    position: absolute;
    top: 85px;
    left: 20px;
    background: var(--hud-bg);
    border: var(--panel-border);
    padding: 8px 12px;
    color: var(--accent);
    font-family: var(--font-main);
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    pointer-events: auto;
    display: none;
}

#steps-scroll {
    position: absolute;
    top: 125px;
    left: 20px;
    width: 240px;
    max-height: 0;
    overflow: hidden;
    pointer-events: auto;
    transition: max-height 0.3s;
}

#steps-scroll.open {
    max-height: min(40vh, 300px);
    overflow-y: auto;
}

#steps-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.step-item {
    background: var(--hud-bg);
    border: var(--panel-border);
    padding: 8px 12px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    display: flex;
    gap: 8px;
}

.step-item.active {
    border-color: var(--accent);
    color: #fff;
}

.step-num {
    color: var(--accent);
    font-family: var(--font-mono);
}

/* MOBILE OPTIMIZATION */
@media (max-width: 600px) {

    #topbar {
        top: 12px;
        gap: 8px;
        padding: 7px 10px;
    }

    #topbar .label {
        font-size: 8px;
    }

    #topbar .value {
        font-size: 10px;
    }

    #compass {
        top: 80px;
        right: 12px;
        width: 55px;
        height: 55px;
    }

    #compass-needle {
        height: 40px;
    }

    #map-container {
        width: 130px;
        height: 130px;
        right: 12px;
        bottom: 15px;
    }

    #stats-panel {
        left: 12px;
        bottom: 15px;
        padding: 10px;
    }

    .stat-val {
        font-size: 13px;
    }

    #direction-panel {
        bottom: 170px;
        min-width: 0;
        width: min(88vw, 340px);
        padding: 10px 12px;
    }

    #dir-text {
        font-size: 16px;
    }

    #dir-arrow-svg {
        width: 34px;
        height: 34px;
    }

    #steps-toggle {
        top: 80px;
        left: 12px;
    }

    #steps-scroll {
        top: 120px;
        left: 12px;
        width: min(230px, 65vw);
    }

    #voice-toast {
        top: 125px;
        left: 12px;
        max-width: 180px;
    }
}
</style>
</head>

<body>

<!-- AR SCENE -->
<a-scene
    id="arScene"
    embedded
    arjs="sourceType: webcam;
          sourceWidth: 1280;
          sourceHeight: 720;
          displayWidth: 1280;
          displayHeight: 720;
          debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true">

    <a-camera
        id="arCamera"
        gps-camera
        rotation-reader>
    </a-camera>

</a-scene>

<!-- HUD -->
<div id="hud">

    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- TOP BAR -->
    <div id="topbar">

        <div id="gps-dot"></div>

        <div>
            <div class="label">GPS</div>
            <div class="value" id="gps-coords">--</div>
        </div>

        <div>
            <div class="label">Heading</div>
            <div class="value" id="heading-val">--°</div>
        </div>

        <div>
            <div class="label">Accuracy</div>
            <div class="value" id="acc-val">--m</div>
        </div>

    </div>

    <!-- COMPASS -->
    <div id="compass">
        <div id="compass-needle"></div>
        <div id="compass-label">N</div>
    </div>

    <!-- DIRECTION PANEL -->
    <div id="direction-panel">

        <svg
            id="dir-arrow-svg"
            viewBox="0 0 44 44"
            fill="none">

            <polygon
                id="dir-arrow-poly"
                points="22,4 38,36 22,28 6,36"
                fill="#00ffe7"/>

        </svg>

        <div>
            <div id="dir-text">Loading…</div>
            <div id="dir-dist"></div>
        </div>

    </div>

    <!-- VOICE TOAST -->
    <div id="voice-toast">
        <span>🔊</span>
        <span id="voice-text"></span>
    </div>

    <!-- ROUTE STEPS -->
    <button id="steps-toggle" onclick="toggleSteps()">
        ▼ ROUTE STEPS
    </button>

    <div id="steps-scroll">
        <div id="steps-list"></div>
    </div>

    <!-- STATS -->
    <div id="stats-panel" style="display:none;">

        <div class="stat-row">
            <span class="stat-label">DISTANCE LEFT</span>
            <span class="stat-val" id="dist-left">--</span>
        </div>

        <div class="stat-row">
            <span class="stat-label">EST. TIME</span>
            <span class="stat-val" id="eta-val">--</span>
        </div>

    </div>

    <!-- MINI MAP -->
    <div id="map-container">
        <div id="map-label">MINI MAP</div>
        <div id="map"></div>
    </div>

    <!-- START BUTTON -->
    <button id="startBtn" onclick="requestPermissions()">
        ◉ START AR NAV
    </button>

    <!-- LOADING -->
    <div id="loading">
        <div class="spinner"></div>
        ACQUIRING SIGNAL…
    </div>

</div>

<script>

/* CONFIGURATION */
const DESTINATION = "Vellore Institute of Technology";
const WAYPOINT_TRIGGER_RADIUS = 15;
const VOICE_AHEAD_DISTANCE = 40;
const MAX_GPS_ACCURACY = 30;

/* STATE */
let map;
let directionsService;
let directionsRenderer;
let userMarker;

let routeSteps = [];
let currentStepIndex = 0;

let userLat = 0;
let userLng = 0;
let deviceHeading = 0;
let headingAvailable = false;

let watchId = null;
let lastVoiceStep = -1;
let arObjects = [];
let navigating = false;

let lastPosition = null;
let routeLeg = null;

/* DOM HELPER */
function el(id) {
    return document.getElementById(id);
}

/* PERMISSIONS */
async function requestPermissions() {

    el('startBtn').style.display = 'none';
    el('loading').style.display = 'block';

    if (!window.isSecureContext) {
        alert("AR navigation requires HTTPS or localhost.");
        resetUI();
        return;
    }

    if (!navigator.geolocation) {
        alert("Geolocation is not supported on this device.");
        resetUI();
        return;
    }

    if (!window.google || !google.maps) {
        alert("Google Maps could not be loaded. Check your API key.");
        resetUI();
        return;
    }

    try {

        if (
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
            try {
                await DeviceOrientationEvent.requestPermission();
            } catch (error) {
                console.warn("Compass permission:", error);
            }
        }

        navigator.geolocation.getCurrentPosition(
            startNavigation,
            function(error) {
                alert("Location error: " + error.message);
                resetUI();
            },
            {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 0
            }
        );

    } catch (error) {

        console.error(error);
        alert("Unable to start navigation.");
        resetUI();

    }
}

/* RESET */
function resetUI() {

    el('startBtn').style.display = '';
    el('loading').style.display = 'none';

}

/* START NAVIGATION */
function startNavigation(position) {

    userLat = position.coords.latitude;
    userLng = position.coords.longitude;
    lastPosition = position;

    const origin = {
        lat: userLat,
        lng: userLng
    };

    el('gps-coords').textContent =
        userLat.toFixed(5) + ', ' + userLng.toFixed(5);

    el('acc-val').textContent =
        Math.round(position.coords.accuracy) + 'm';

    map = new google.maps.Map(el('map'), {

        center: origin,
        zoom: 16,
        disableDefaultUI: true,
        styles: darkMapStyle()

    });

    userMarker = new google.maps.Marker({

        position: origin,
        map: map,

        icon: {
            path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
            scale: 5,
            fillColor: '#00ffe7',
            fillOpacity: 1,
            strokeColor: '#ffffff',
            strokeWeight: 1,
            rotation: 0
        }

    });

    directionsService = new google.maps.DirectionsService();

    directionsRenderer = new google.maps.DirectionsRenderer({

        suppressMarkers: false,

        polylineOptions: {
            strokeColor: '#00ffe7',
            strokeWeight: 4,
            strokeOpacity: 0.85
        }

    });

    directionsRenderer.setMap(map);

    directionsService.route({

        origin: origin,
        destination: DESTINATION,
        travelMode: google.maps.TravelMode.WALKING

    }, function(result, status) {

        if (status === "OK") {

            directionsRenderer.setDirections(result);

            processRoute(result);

            if (!routeSteps.length) {
                alert("No route steps were returned.");
                resetUI();
                return;
            }

            el('loading').style.display = 'none';
            el('direction-panel').style.display = 'flex';
            el('stats-panel').style.display = 'block';
            el('steps-toggle').style.display = 'block';

            navigating = true;

            startTracking();
            setupCompass();
            updateDirectionToNextStep();

        } else {

            alert("Directions error: " + status);
            resetUI();

        }

    });
}

/* ROUTE PROCESSING */
function processRoute(result) {

    routeLeg = result.routes[0].legs[0];

    routeSteps = routeLeg.steps.map(function(step, index) {

        return {

            index: index,
            instruction: stripHTML(step.instructions),
            maneuver: step.maneuver || '',
            distMeters: step.distance.value,
            distText: step.distance.text,
            durationSeconds: step.duration.value,
            lat: step.end_location.lat(),
            lng: step.end_location.lng(),
            startLat: step.start_location.lat(),
            startLng: step.start_location.lng()

        };

    });

    currentStepIndex = 0;
    lastVoiceStep = -1;

    placeARArrows(routeSteps.slice(0, 8));

    const list = el('steps-list');
    list.innerHTML = '';

    routeSteps.forEach(function(step, index) {

        const item = document.createElement('div');

        item.className =
            'step-item' + (index === 0 ? ' active' : '');

        item.id = 'step-' + index;

        const number = document.createElement('span');
        number.className = 'step-num';
        number.textContent = String(index + 1);

        const instruction = document.createElement('span');
        instruction.textContent = step.instruction;

        item.appendChild(number);
        item.appendChild(instruction);

        list.appendChild(item);

    });

    el('eta-val').textContent = routeLeg.duration.text;
    el('dist-left').textContent = routeLeg.distance.text;

    if (routeSteps.length) {

        updateDirectionPanel(routeSteps[0]);

        speakInstruction(
            "Navigation started. " + routeSteps[0].instruction
        );

    }
}

/* AR ARROWS */
function placeARArrows(steps) {

    const scene = el('arScene');

    arObjects.forEach(function(object) {

        if (object.parentNode) {
            object.parentNode.removeChild(object);
        }

    });

    arObjects = [];

    steps.forEach(function(step, index) {

        const group = document.createElement('a-entity');

        group.setAttribute(
            'gps-entity-place',
            'latitude: ' + step.lat + '; longitude: ' + step.lng
        );

        group.setAttribute('position', '0 2.5 0');

        const bearing = computeBearing(
            step.startLat,
            step.startLng,
            step.lat,
            step.lng
        );

        group.setAttribute('rotation', '0 ' + (-bearing) + ' 0');

        /* ARROW BODY */
        const body = document.createElement('a-box');

        body.setAttribute(
            'color',
            index === 0 ? '#00ffe7' : '#ff6a00'
        );

        body.setAttribute('width', '0.5');
        body.setAttribute('height', '0.18');
        body.setAttribute('depth', '1.5');
        body.setAttribute('position', '0 0 -0.3');
        body.setAttribute('opacity', '0.9');

        /* ARROW HEAD */
        const head = document.createElement('a-cone');

        head.setAttribute(
            'color',
            index === 0 ? '#00ffe7' : '#ff6a00'
        );

        head.setAttribute('radius-bottom', '0.55');
        head.setAttribute('radius-top', '0');
        head.setAttribute('height', '0.9');
        head.setAttribute('rotation', '-90 0 0');
        head.setAttribute('position', '0 0 -1.4');
        head.setAttribute('opacity', '0.9');

        /* STEP NUMBER */
        const label = document.createElement('a-text');

        label.setAttribute('value', String(index + 1));
        label.setAttribute('align', 'center');
        label.setAttribute('color', '#ffffff');
        label.setAttribute('scale', '2 2 2');
        label.setAttribute('position', '0 1.0 0');
        label.setAttribute('side', 'double');

        /* POLE */
        const pole = document.createElement('a-cylinder');

        pole.setAttribute('color', '#00ffe7');
        pole.setAttribute('radius', '0.04');
        pole.setAttribute('height', '2');
        pole.setAttribute('opacity', '0.45');
        pole.setAttribute('position', '0 -1 0');

        group.setAttribute(
            'animation__bob',
            'property: position; from: 0 2.5 0; ' +
            'to: 0 3.0 0; dir: alternate; loop: true; ' +
            'dur: 1800; easing: easeInOutSine'
        );

        group.appendChild(body);
        group.appendChild(head);
        group.appendChild(label);
        group.appendChild(pole);

        scene.appendChild(group);

        arObjects.push(group);

    });
}

/* GPS TRACKING */
function startTracking() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    watchId = navigator.geolocation.watchPosition(

        onLocationUpdate,

        function(error) {
            console.warn("GPS tracking error:", error.message);
        },

        {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 15000
        }

    );
}

/* GPS UPDATE */
function onLocationUpdate(position) {

    userLat = position.coords.latitude;
    userLng = position.coords.longitude;
    lastPosition = position;

    const accuracy = position.coords.accuracy;

    el('gps-coords').textContent =
        userLat.toFixed(5) + ', ' + userLng.toFixed(5);

    el('acc-val').textContent =
        Math.round(accuracy) + 'm';

    el('gps-dot').classList.toggle(
        'active',
        accuracy <= MAX_GPS_ACCURACY
    );

    if (userMarker && map) {

        const location = {
            lat: userLat,
            lng: userLng
        };

        userMarker.setPosition(location);
        map.panTo(location);

    }

    updateDirectionToNextStep();

    if (accuracy <= MAX_GPS_ACCURACY) {
        checkStepProgress();
    }
}

/* WAYPOINT PROGRESS */
function checkStepProgress() {

    if (!navigating) return;
    if (currentStepIndex >= routeSteps.length) return;

    const step = routeSteps[currentStepIndex];

    const distance = haversine(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    if (distance <= WAYPOINT_TRIGGER_RADIUS) {

        currentStepIndex++;

        if (currentStepIndex < routeSteps.length) {

            highlightStep(currentStepIndex);

            updateDirectionPanel(
                routeSteps[currentStepIndex]
            );

            speakInstruction(
                routeSteps[currentStepIndex].instruction
            );

            lastVoiceStep = currentStepIndex;

        } else {

            navigating = false;

            el('dir-text').textContent = 'Destination Reached!';
            el('dir-dist').textContent = '';

            speakInstruction(
                "You have arrived at your destination."
            );

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

        }

        updateRemainingDistance();
        return;
    }

    if (
        currentStepIndex !== lastVoiceStep &&
        distance < VOICE_AHEAD_DISTANCE
    ) {

        speakInstruction(
            "In " + formatDist(distance) +
            ", " + step.instruction
        );

        lastVoiceStep = currentStepIndex;
    }

    updateRemainingDistance();
}

/* REMAINING DISTANCE */
function updateRemainingDistance() {

    if (currentStepIndex >= routeSteps.length) {
        el('dist-left').textContent = '0 m';
        el('eta-val').textContent = '0 min';
        return;
    }

    const step = routeSteps[currentStepIndex];

    let remaining = haversine(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    for (
        let i = currentStepIndex + 1;
        i < routeSteps.length;
        i++
    ) {
        remaining += routeSteps[i].distMeters;
    }

    el('dist-left').textContent = formatDist(remaining);

    const estimatedMinutes = Math.ceil(
        remaining / 1.3 / 60
    );

    el('eta-val').textContent =
        estimatedMinutes + ' min';
}

/* DIRECTION ARROW */
function updateDirectionToNextStep() {

    if (!navigating) return;
    if (currentStepIndex >= routeSteps.length) return;

    const step = routeSteps[currentStepIndex];

    const bearing = computeBearing(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    if (headingAvailable) {

        let relativeBearing =
            (bearing - deviceHeading + 360) % 360;

        if (relativeBearing > 180) {
            relativeBearing -= 360;
        }

        el('dir-arrow-svg').style.transform =
            'rotate(' + relativeBearing + 'deg)';

    }

    const distance = haversine(
        userLat,
        userLng,
        step.lat,
        step.lng
    );

    el('dir-dist').textContent =
        formatDist(distance) + ' to next point';
}

/* INSTRUCTION PANEL */
function updateDirectionPanel(step) {

    el('dir-text').textContent = step.instruction;
    el('dir-dist').textContent = step.distText;

    const isTurn = /turn|left|right|merge|ramp/i.test(
        step.maneuver + ' ' + step.instruction
    );

    el('dir-arrow-poly').setAttribute(
        'fill',
        isTurn ? '#ff6a00' : '#00ffe7'
    );
}

/* HIGHLIGHT ROUTE STEP */
function highlightStep(index) {

    document.querySelectorAll('.step-item').forEach(
        function(item) {
            item.classList.remove('active');
        }
    );

    const item = el('step-' + index);

    if (item) {
        item.classList.add('active');
    }
}

/* COMPASS */
let compassInitialized = false;

function setupCompass() {

    if (compassInitialized) return;

    compassInitialized = true;

    if ('ondeviceorientationabsolute' in window) {

        window.addEventListener(
            'deviceorientationabsolute',
            onOrientation,
            true
        );

    } else {

        window.addEventListener(
            'deviceorientation',
            onOrientation,
            true
        );

    }
}

/* ORIENTATION */
function onOrientation(event) {

    let heading = null;

    if (typeof event.webkitCompassHeading === 'number') {

        heading = event.webkitCompassHeading;

    } else if (event.alpha !== null) {

        heading = (360 - event.alpha + 360) % 360;

    }

    if (heading === null) return;

    deviceHeading = heading;
    headingAvailable = true;

    el('heading-val').textContent =
        Math.round(heading) + '°';

    el('compass-needle').style.transform =
        'rotate(' + (-heading) + 'deg)';

    updateDirectionToNextStep();
}

/* VOICE */
let toastTimer = null;

function speakInstruction(text) {

    const toast = el('voice-toast');

    el('voice-text').textContent = text;

    toast.classList.add('show');

    clearTimeout(toastTimer);

    toastTimer = setTimeout(function() {
        toast.classList.remove('show');
    }, 4500);

    if (
        !('speechSynthesis' in window) ||
        !('SpeechSynthesisUtterance' in window)
    ) {
        return;
    }

    try {

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang = 'en-IN';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        window.speechSynthesis.speak(utterance);

    } catch (error) {

        console.warn("Voice error:", error);

    }
}

/* DISTANCE */
function haversine(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

/* BEARING */
function computeBearing(lat1, lon1, lat2, lon2) {

    const dLon = toRad(lon2 - lon1);

    const y =
        Math.sin(dLon) * Math.cos(toRad(lat2));

    const x =
        Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) *
        Math.cos(toRad(lat2)) *
        Math.cos(dLon);

    return (
        toDeg(Math.atan2(y, x)) + 360
    ) % 360;
}

function toRad(value) {
    return value * Math.PI / 180;
}

function toDeg(value) {
    return value * 180 / Math.PI;
}

function formatDist(distance) {

    return distance >= 1000
        ? (distance / 1000).toFixed(1) + ' km'
        : Math.round(distance) + ' m';
}

/* REMOVE HTML FROM DIRECTIONS */
function stripHTML(html) {

    const container = document.createElement('div');
    container.innerHTML = html;

    return container.textContent || '';
}

/* TOGGLE ROUTE STEPS */
function toggleSteps() {

    el('steps-scroll').classList.toggle('open');

}

/* DARK MAP */
function darkMapStyle() {

    return [

        {
            elementType: 'geometry',
            stylers: [{ color: '#0d1117' }]
        },

        {
            elementType: 'labels.text.stroke',
            stylers: [{ color: '#0d1117' }]
        },

        {
            elementType: 'labels.text.fill',
            stylers: [{ color: '#8ec3b9' }]
        },

        {
            featureType: 'road',
            elementType: 'geometry',
            stylers: [{ color: '#1a2332' }]
        },

        {
            featureType: 'road.highway',
            elementType: 'geometry',
            stylers: [{ color: '#2c3e50' }]
        },

        {
            featureType: 'water',
            elementType: 'geometry',
            stylers: [{ color: '#0a1628' }]
        },

        {
            featureType: 'poi',
            stylers: [{ visibility: 'off' }]
        },

        {
            featureType: 'transit',
            stylers: [{ visibility: 'off' }]
        },

        {
            featureType: 'administrative.locality',
            elementType: 'labels.text.fill',
            stylers: [{ color: '#00ffe7' }]
        }

    ];
}

/* CLEANUP */
window.addEventListener('pagehide', function() {

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }

});

</script>
