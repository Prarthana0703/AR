
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AR Live Navigation</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* LIVE CAMERA */
#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    background: #000;
}

/* AR OVERLAY */
#overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}

.panel {
    background: rgba(4,16,24,0.80);
    border: 1px solid rgba(0,255,231,0.45);
    border-radius: 12px;
    backdrop-filter: blur(8px);
}

#topbar {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    padding: 12px;
    max-width: 96vw;
}

.stat {
    text-align: center;
}

.stat small {
    color: #00ffe7;
    font-size: 10px;
}

.stat div {
    font-size: 12px;
    margin-top: 5px;
}

/* DIRECTION ARROW */
#arrow-area {
    position: absolute;
    left: 50%;
    top: 43%;
    transform: translate(-50%,-50%);
    text-align: center;
    display: none;
}

#main-arrow {
    width: 140px;
    height: 140px;
    filter: drop-shadow(0 0 18px #00ffe7);
    transition: transform 0.3s ease;
}

#arrow-distance {
    margin-top: 15px;
    font-size: 24px;
    font-weight: bold;
    color: #00ffe7;
    text-shadow: 0 2px 8px #000;
}

/* DIRECTION PANEL */
#instruction {
    position: absolute;
    bottom: 205px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px;
    width: min(92vw,400px);
    text-align: center;
    display: none;
}

#instruction-text {
    font-size: 18px;
    font-weight: bold;
    line-height: 1.4;
}

#instruction-distance {
    margin-top: 7px;
    color: #00ffe7;
    font-size: 13px;
}

/* COMPASS */
#compass {
    position: absolute;
    right: 15px;
    top: 90px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

#needle {
    height: 48px;
    width: 5px;
    border-radius: 5px;
    background: linear-gradient(
        to bottom,
        #ff4444 50%,
        #ffffff 50%
    );
    transition: transform .2s ease;
}

/* BOTTOM STATS */
#bottom-stats {
    position: absolute;
    bottom: max(15px,env(safe-area-inset-bottom));
    left: 12px;
    padding: 12px;
    display: none;
}

#bottom-stats small {
    color: #00ffe7;
    font-size: 10px;
}

#bottom-stats strong {
    display: block;
    margin: 5px 0 12px;
    font-size: 17px;
}

/* MAP */
#map-box {
    position: absolute;
    bottom: max(15px,env(safe-area-inset-bottom));
    right: 12px;
    width: 170px;
    height: 170px;
    overflow: hidden;
    pointer-events: auto;
}

#map {
    width: 100%;
    height: 100%;
}

/* CONTROLS */
.control {
    pointer-events: auto;
    background: rgba(0,14,22,.90);
    border: 1px solid #00ffe7;
    border-radius: 10px;
    color: #00ffe7;
    cursor: pointer;
    padding: 12px 18px;
    font-weight: bold;
}

#start {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    font-size: 18px;
    white-space: nowrap;
}

#back {
    position: absolute;
    left: 12px;
    top: 90px;
}

#zoom {
    position: absolute;
    right: 14px;
    top: 177px;
    display: none;
}

#status {
    position: absolute;
    top: 65%;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw,400px);
    text-align: center;
    background: rgba(0,0,0,.83);
    color: #fff;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.5;
    display: none;
}

#steps-button {
    position: absolute;
    left: 12px;
    top: 145px;
    display: none;
}

#steps {
    position: absolute;
    top: 200px;
    left: 12px;
    width: min(260px,80vw);
    max-height: 35vh;
    overflow-y: auto;
    display: none;
    padding: 12px;
    pointer-events: auto;
}

.step {
    font-size: 13px;
    padding: 9px 0;
    border-bottom: 1px solid #334;
}

.step.active {
    color: #00ffe7;
}

@media(max-width:600px) {
    #topbar {
        gap: 8px;
        padding: 9px;
    }

    .stat small {
        font-size: 8px;
    }

    .stat div {
        font-size: 10px;
    }

    #main-arrow {
        width: 115px;
        height: 115px;
    }

    #arrow-distance {
        font-size: 19px;
    }

    #map-box {
        width: 130px;
        height: 130px;
    }

    #bottom-stats {
        padding: 9px;
    }

    #bottom-stats strong {
        font-size: 14px;
    }

    #instruction {
        bottom: 165px;
        padding: 11px;
    }

    #instruction-text {
        font-size: 15px;
    }

    #compass {
        width: 55px;
        height: 55px;
    }

    #needle {
        height: 38px;
    }

    #zoom {
        top: 160px;
    }
}
</style>
</head>

<body>

<!-- DIRECT CAMERA VIDEO -->
<video
    id="camera"
    autoplay
    muted
    playsinline
    webkit-playsinline>
</video>

<!-- AR NAVIGATION INTERFACE -->
<div id="overlay">

    <div id="topbar" class="panel">
        <div class="stat">
            <small>GPS</small>
            <div id="gps">--</div>
        </div>

        <div class="stat">
            <small>HEADING</small>
            <div id="heading">--°</div>
        </div>

        <div class="stat">
            <small>ACCURACY</small>
            <div id="accuracy">--m</div>
        </div>
    </div>

    <div id="compass" class="panel">
        <div id="needle"></div>
    </div>

    <!-- AR DIRECTION ARROW -->
    <div id="arrow-area">
        <svg id="main-arrow" viewBox="0 0 100 100">
            <path
                d="M50 5 L93 78 L50 62 L7 78 Z"
                fill="#00ffe7"
                stroke="#ffffff"
                stroke-width="2">
            </path>
        </svg>
        <div id="arrow-distance">--</div>
    </div>

    <!-- NEXT INSTRUCTION -->
    <div id="instruction" class="panel">
        <div id="instruction-text">
            Finding direction...
        </div>
        <div id="instruction-distance">--</div>
    </div>

    <!-- DISTANCE AND ETA -->
    <div id="bottom-stats" class="panel">
        <small>DISTANCE LEFT</small>
        <strong id="remaining">--</strong>

        <small>ESTIMATED TIME</small>
        <strong id="eta">--</strong>
    </div>

    <!-- MINI MAP -->
    <div id="map-box" class="panel">
        <div id="map"></div>
    </div>

    <!-- BUTTONS -->
    <button id="start" class="control" onclick="startNavigation()">
        ◉ START AR NAV
    </button>

    <button id="back" class="control" onclick="goBack()">
        ← BACK
    </button>

    <button id="zoom" class="control" onclick="changeZoom()">
        0.5×
    </button>

    <button id="steps-button" class="control" onclick="toggleSteps()">
        ROUTE STEPS
    </button>

    <div id="steps" class="panel"></div>

    <div id="status" role="status"></div>

</div>

<!-- YOUR RESTRICTED GOOGLE MAPS API KEY -->
<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCh_SqXafoV8q-EEXifAaCGqWOeRi50jNA">
</script>

<script>

/* CONFIGURATION */
const DESTINATION = "Vellore Institute of Technology";
const WAYPOINT_RADIUS = 15;
const MAX_GPS_ACCURACY = 30;

let stream = null;
let map = null;
let marker = null;
let directionsService = null;
let directionsRenderer = null;

let routeSteps = [];
let currentStep = 0;

let latitude = null;
let longitude = null;
let heading = null;

let watchId = null;
let started = false;
let arrived = false;

let videoTrack = null;
let zoomValues = [];
let zoomIndex = 0;
let currentAccuracy = Infinity;
let orientationStarted = false;

const $ = id => document.getElementById(id);

/* STATUS MESSAGE */
function statusMessage(message, duration=0) {
    const box = $("status");
    box.textContent = message;
    box.style.display = "block";

    if(duration > 0) {
        setTimeout(() => {
            if(box.textContent === message) {
                box.style.display = "none";
            }
        }, duration);
    }
}

/* START CAMERA FIRST */
async function openCamera() {
    if(!navigator.mediaDevices?.getUserMedia) {
        throw new Error(
            "Camera access unavailable. Use HTTPS and a supported browser."
        );
    }

    const constraints = [
        {
            audio: false,
            video: {
                facingMode: {ideal:"environment"},
                width: {ideal:1280},
                height: {ideal:720}
            }
        },
        {
            audio:false,
            video:true
        }
    ];

    let lastError;

    for(const options of constraints) {
        try {
            stream = await navigator.mediaDevices.getUserMedia(options);
            break;
        } catch(error) {
            lastError = error;
        }
    }

    if(!stream) {
        throw lastError || new Error("Camera unavailable");
    }

    const video = $("camera");
    video.srcObject = stream;

    await video.play();

    videoTrack = stream.getVideoTracks()[0];

    /* OPTIONAL HARDWARE ZOOM */
    try {
        const caps = videoTrack.getCapabilities?.();

        if(caps?.zoom) {
            const {min,max,step} = caps.zoom;
            const increment = step || (max-min)/10 || 1;

            const middle = Math.min(
                max,
                Math.max(min,1)
            );

            zoomValues = [min,middle,max]
                .filter((v,i,a) =>
                    a.findIndex(x=>Math.abs(x-v)<0.001)===i
                );

            zoomIndex = 0;

            if(videoTrack.applyConstraints) {
                await videoTrack.applyConstraints({
                    advanced:[{zoom:zoomValues[0]}]
                });
            }

            $("zoom").style.display =
                zoomValues.length > 1 ? "block" : "none";

            $("zoom").textContent =
                zoomValues[0].toFixed(1)+"×";
        }
    } catch(error) {
        console.warn("Camera zoom unavailable:", error);
    }

    return true;
}

async function changeZoom() {
    if(!videoTrack || !zoomValues.length) return;

    zoomIndex = (zoomIndex+1)%zoomValues.length;

    const value=zoomValues[zoomIndex];

    try {
        await videoTrack.applyConstraints({
            advanced:[{zoom:value}]
        });
        $("zoom").textContent=value.toFixed(1)+"×";
    } catch(error) {
        statusMessage("Zoom not supported by this camera.",3000);
    }
}

/* START NAVIGATION */
async function startNavigation() {
    if(started) return;

    $("start").disabled=true;
    $("start").style.display="none";

    if(!window.isSecureContext) {
        statusMessage("Open this website using HTTPS.");
        $("start").style.display="block";
        $("start").disabled=false;
        return;
    }

    try {
        statusMessage("Opening rear camera...");

        await openCamera();

        /* CAMERA NOW VISIBLE BEFORE GPS */
        started=true;

        statusMessage(
            "Camera active. Requesting GPS and compass...",
            3500
        );

        await setupOrientation();

        if(!navigator.geolocation) {
            statusMessage("GPS unavailable. Camera remains active.");
            return;
        }

        navigator.geolocation.getCurrentPosition(
            position=>{
                updatePosition(position);
                initializeRoute();
            },
            error=>{
                statusMessage(
                    "Camera is working, but GPS failed: "+
                    error.message
                );
            },
            {
                enableHighAccuracy:true,
                timeout:20000,
                maximumAge:0
            }
        );

    } catch(error) {
        console.error(error);

        statusMessage(
            "Camera failed: "+error.name+" — "+error.message
        );

        $("start").disabled=false;
        $("start").style.display="block";
        stopCamera();
        started=false;
    }
}

/* DEVICE ORIENTATION */
async function setupOrientation() {
    if(orientationStarted) return;

    if(typeof DeviceOrientationEvent==="undefined") {
        statusMessage("Compass unavailable; camera still works.",4000);
        return;
    }

    if(typeof DeviceOrientationEvent.requestPermission==="function") {
        try {
            const result=await DeviceOrientationEvent.requestPermission();
            if(result!=="granted") return;
        } catch(error) {
            console.warn("Orientation permission:",error);
            return;
        }
    }

    orientationStarted=true;

    window.addEventListener(
        "deviceorientationabsolute",
        updateOrientation,
        true
    );

    window.addEventListener(
        "deviceorientation",
        updateOrientation,
        true
    );
}

function updateOrientation(event) {
    let newHeading=null;

    if(typeof event.webkitCompassHeading==="number") {
        newHeading=event.webkitCompassHeading;

    } else if(
        event.absolute &&
        typeof event.alpha==="number"
    ) {
        newHeading=(360-event.alpha)%360;
    }

    if(newHeading===null || !Number.isFinite(newHeading)) return;

    heading=(newHeading+360)%360;

    $("heading").textContent=Math.round(heading)+"°";

    $("needle").style.transform=
        "rotate("+(-heading)+"deg)";

    updateArrow();
}

/* GPS UPDATE */
function updatePosition(position) {
    latitude=position.coords.latitude;
    longitude=position.coords.longitude;

    currentAccuracy=position.coords.accuracy;

    $("gps").textContent=
        latitude.toFixed(4)+", "+longitude.toFixed(4);

    $("accuracy").textContent=
        Math.round(currentAccuracy)+"m";

    if(marker) {
        marker.setPosition({
            lat:latitude,
            lng:longitude
        });
    }

    updateArrow();

    if(
        currentAccuracy<=MAX_GPS_ACCURACY &&
        routeSteps.length>0
    ) {
        checkProgress();
    }
}

/* GOOGLE MAP AND WALKING ROUTE */
function initializeRoute() {
    if(!window.google?.maps) {
        statusMessage(
            "Camera active. Google Maps unavailable: check API key."
        );
        return;
    }

    const origin={
        lat:latitude,
        lng:longitude
    };

    map=new google.maps.Map($("map"),{
        center:origin,
        zoom:17,
        disableDefaultUI:true
    });

    marker=new google.maps.Marker({
        position:origin,
        map:map,
        title:"Your location"
    });

    directionsService=new google.maps.DirectionsService();

    directionsRenderer=new google.maps.DirectionsRenderer({
        polylineOptions:{
            strokeColor:"#00ffe7",
            strokeWeight:5
        }
    });

    directionsRenderer.setMap(map);

    directionsService.route({
        origin:origin,
        destination:DESTINATION,
        travelMode:google.maps.TravelMode.WALKING
    },(result,status)=>{

        if(status!=="OK") {
            statusMessage(
                "Camera active. Route error: "+status
            );
            return;
        }

        directionsRenderer.setDirections(result);

        const leg=result.routes[0].legs[0];

        routeSteps=leg.steps.map(step=>({
            text:stripHTML(step.instructions),
            lat:step.end_location.lat(),
            lng:step.end_location.lng(),
            distance:step.distance.value
        }));

        currentStep=0;
        arrived=false;

        $("remaining").textContent=leg.distance.text;
        $("eta").textContent=leg.duration.text;

        $("arrow-area").style.display="block";
        $("instruction").style.display="block";
        $("bottom-stats").style.display="block";
        $("steps-button").style.display="block";

        buildSteps();
        updateInstruction();
        updateArrow();

        statusMessage("AR navigation started.",2500);

        speak("Navigation started.");

        startGPSWatch();
    });
}

function stripHTML(html) {
    const div=document.createElement("div");
    div.innerHTML=html;
    return div.textContent||"";
}

/* ROUTE STEP LIST */
function buildSteps() {
    const container=$("steps");
    container.innerHTML="";

    routeSteps.forEach((step,index)=>{
        const div=document.createElement("div");
        div.className="step"+(index===0?" active":"");
        div.id="step-"+index;
        div.textContent=(index+1)+". "+step.text;
        container.appendChild(div);
    });
}

function toggleSteps() {
    const el=$("steps");
    el.style.display=
        el.style.display==="block"?"none":"block";
}

/* GPS WATCH */
function startGPSWatch() {
    if(watchId!==null) {
        navigator.geolocation.clearWatch(watchId);
    }

    watchId=navigator.geolocation.watchPosition(
        position=>{
            updatePosition(position);

            if(map) {
                map.panTo({
                    lat:latitude,
                    lng:longitude
                });
            }
        },
        error=>{
            console.warn("GPS:",error.message);
            statusMessage(
                "GPS signal problem: "+error.message,
                4000
            );
        },
        {
            enableHighAccuracy:true,
            maximumAge:1000,
            timeout:15000
        }
    );
}

/* DISTANCE */
function toRad(deg) {
    return deg*Math.PI/180;
}

function distanceMeters(lat1,lon1,lat2,lon2) {
    const R=6371000;
    const dLat=toRad(lat2-lat1);
    const dLon=toRad(lon2-lon1);

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(toRad(lat1))*
        Math.cos(toRad(lat2))*
        Math.sin(dLon/2)**2;

    return 2*R*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}

function bearingTo(lat1,lon1,lat2,lon2) {
    const dLon=toRad(lon2-lon1);

    const y=Math.sin(dLon)*Math.cos(toRad(lat2));

    const x=
        Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-
        Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*
        Math.cos(dLon);

    return (
        Math.atan2(y,x)*180/Math.PI+360
    )%360;
}

function formatDistance(m) {
    return m>=1000
        ?(m/1000).toFixed(1)+" km"
        :Math.round(m)+" m";
}

/* AR DIRECTION OVER CAMERA */
function updateArrow() {
    if(
        !routeSteps.length ||
        currentStep>=routeSteps.length ||
        latitude===null
    ) return;

    const step=routeSteps[currentStep];

    const distance=distanceMeters(
        latitude,longitude,
        step.lat,step.lng
    );

    $("arrow-distance").textContent=
        formatDistance(distance);

    $("instruction-distance").textContent=
        formatDistance(distance)+" to next waypoint";

    if(heading!==null) {
        const target=bearingTo(
            latitude,longitude,
            step.lat,step.lng
        );

        let relative=(target-heading+360)%360;

        if(relative>180) relative-=360;

        $("main-arrow").style.transform=
            "rotate("+relative+"deg)";
    } else {
        $("main-arrow").style.transform="rotate(0deg)";
    }

    let remaining=distance;

    for(let i=currentStep+1;i<routeSteps.length;i++) {
        remaining+=routeSteps[i].distance;
    }

    $("remaining").textContent=formatDistance(remaining);
    $("eta").textContent=
        Math.max(1,Math.ceil(remaining/1.3/60))+" min";
}

/* WAYPOINT PROGRESS */
function checkProgress() {
    if(arrived || currentStep>=routeSteps.length) return;

    const step=routeSteps[currentStep];

    const dist=distanceMeters(
        latitude,longitude,
        step.lat,step.lng
    );

    if(dist>WAYPOINT_RADIUS) return;

    currentStep++;

    if(currentStep>=routeSteps.length) {
        arrived=true;

        $("instruction-text").textContent=
            "Destination reached!";

        $("instruction-distance").textContent="";
        $("arrow-area").style.display="none";
        $("remaining").textContent="0 m";
        $("eta").textContent="0 min";

        speak("You have arrived at your destination.");
        return;
    }

    updateInstruction();
    updateArrow();

    speak(routeSteps[currentStep].text);
}

function updateInstruction() {
    if(currentStep>=routeSteps.length) return;

    $("instruction-text").textContent=
        routeSteps[currentStep].text;

    document.querySelectorAll(".step").forEach(
        el=>el.classList.remove("active")
    );

    $("step-"+currentStep)?.classList.add("active");
}

/* VOICE */
function speak(text) {
    if(!("speechSynthesis" in window)) return;

    try {
        speechSynthesis.cancel();

        const utterance=new SpeechSynthesisUtterance(text);
        utterance.lang="en-IN";
        utterance.rate=1;

        speechSynthesis.speak(utterance);
    } catch(error) {
        console.warn("Speech unavailable:",error);
    }
}

/* CAMERA CLEANUP */
function stopCamera() {
    if(stream) {
        stream.getTracks().forEach(track=>track.stop());
        stream=null;
    }
    $("camera").srcObject=null;
}

/* BACK HOME */
function goBack() {
    cleanup();
    window.location.href="home.html";
}

function cleanup() {
    if(watchId!==null) {
        navigator.geolocation.clearWatch(watchId);
        watchId=null;
    }

    stopCamera();

    if("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }
}

window.addEventListener("pagehide",cleanup);

</script>
</body>
</html>
