
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>AR Live Wedding Navigation</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;height:100%;overflow:hidden;
 background:#000;color:#fff;font-family:Arial,sans-serif
}
button{font:inherit;cursor:pointer}

/* CAMERA */
#camera{
 position:fixed;inset:0;width:100%;height:100%;
 object-fit:cover;background:#000;z-index:0
}
#overlay{position:fixed;inset:0;z-index:2;pointer-events:none}
.panel{
 background:rgba(4,16,24,.84);
 border:1px solid rgba(0,255,231,.5);
 border-radius:12px;
 backdrop-filter:blur(8px)
}
#topbar{
 position:absolute;top:max(14px,env(safe-area-inset-top));
 left:50%;transform:translateX(-50%);
 display:flex;gap:15px;padding:12px;max-width:96vw
}
.stat{text-align:center}
.stat small{color:#00ffe7;font-size:10px}
.stat div{font-size:12px;margin-top:5px}

/* AR DIRECTION INDICATOR */
#arrow-area{
 position:absolute;left:50%;top:43%;
 transform:translate(-50%,-50%);
 text-align:center;display:none
}
#main-arrow{
 width:140px;height:140px;
 filter:drop-shadow(0 0 18px #00ffe7);
 transition:transform .25s ease
}
#arrow-distance{
 margin-top:15px;font-size:24px;font-weight:bold;
 color:#00ffe7;text-shadow:0 2px 8px #000
}
#instruction{
 position:absolute;bottom:205px;left:50%;
 transform:translateX(-50%);padding:14px;
 width:min(92vw,400px);text-align:center;display:none
}
#instruction-text{font-size:18px;font-weight:bold;line-height:1.4}
#instruction-distance{margin-top:7px;color:#00ffe7;font-size:13px}

/* COMPASS */
#compass{
 position:absolute;right:15px;top:90px;
 width:70px;height:70px;border-radius:50%;
 display:flex;align-items:center;justify-content:center
}
#needle{
 height:48px;width:5px;border-radius:5px;
 background:linear-gradient(to bottom,#ff4444 50%,#fff 50%);
 transition:transform .2s ease
}

/* STATS AND MAP */
#bottom-stats{
 position:absolute;bottom:max(15px,env(safe-area-inset-bottom));
 left:12px;padding:12px;display:none
}
#bottom-stats small{color:#00ffe7;font-size:10px}
#bottom-stats strong{
 display:block;margin:5px 0 12px;font-size:17px
}
#map-box{
 position:absolute;bottom:max(15px,env(safe-area-inset-bottom));
 right:12px;width:170px;height:170px;
 overflow:hidden;pointer-events:auto;display:none
}
#map{width:100%;height:100%}

/* BUTTONS */
.control{
 pointer-events:auto;background:rgba(0,14,22,.94);
 border:1px solid #00ffe7;border-radius:10px;
 color:#00ffe7;padding:11px 14px;
 font-weight:bold;font-size:12px
}
.control:disabled{opacity:.5}
#start{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 font-size:18px;white-space:nowrap
}
#back{position:absolute;left:12px;top:90px}
#zoom{position:absolute;right:14px;top:177px;display:none}
#steps-button{position:absolute;left:12px;top:145px;display:none}
#reroute-button{position:absolute;left:12px;top:200px;display:none}
#metrics-button{position:absolute;left:12px;top:255px;display:none}

#steps{
 position:absolute;top:310px;left:12px;
 width:min(280px,85vw);max-height:32vh;
 overflow:auto;display:none;padding:12px;
 pointer-events:auto
}
.step{
 font-size:13px;padding:9px 0;
 border-bottom:1px solid #334
}
.step.active{color:#00ffe7;font-weight:bold}

#status{
 position:absolute;top:65%;left:50%;
 transform:translateX(-50%);
 width:min(92vw,400px);text-align:center;
 background:rgba(0,0,0,.87);color:white;
 border-radius:8px;padding:12px;
 font-size:13px;line-height:1.5;display:none
}
#metrics{
 position:absolute;top:310px;right:10px;
 padding:12px;font:11px/1.8 monospace;
 display:none;max-width:68vw
}
#metrics.visible{display:block}

/* MOBILE */
@media(max-width:600px){
 #topbar{gap:8px;padding:9px}
 .stat small{font-size:8px}
 .stat div{font-size:10px}
 #main-arrow{width:115px;height:115px}
 #arrow-distance{font-size:19px}
 #map-box{width:130px;height:130px}
 #bottom-stats{padding:9px}
 #bottom-stats strong{font-size:14px}
 #instruction{bottom:165px;padding:11px}
 #instruction-text{font-size:15px}
 #compass{width:55px;height:55px}
 #needle{height:38px}
 #zoom{top:160px}
 #reroute-button{top:197px}
 #metrics-button{top:247px}
 #metrics{top:300px}
}
</style>
</head>

<body>

<!-- CAMERA -->
<video id="camera" autoplay muted playsinline></video>

<div id="overlay">

 <div id="topbar" class="panel">
  <div class="stat">
   <small>GPS</small><div id="gps">--</div>
  </div>
  <div class="stat">
   <small>HEADING</small><div id="heading">--°</div>
  </div>
  <div class="stat">
   <small>ACCURACY</small><div id="accuracy">--m</div>
  </div>
 </div>

 <div id="compass" class="panel">
  <div id="needle"></div>
 </div>

 <div id="arrow-area">
  <svg id="main-arrow" viewBox="0 0 100 100">
   <path d="M50 5 L93 78 L50 62 L7 78 Z"
    fill="#00ffe7" stroke="#fff" stroke-width="2"/>
  </svg>
  <div id="arrow-distance">--</div>
 </div>

 <div id="instruction" class="panel">
  <div id="instruction-text">Finding direction...</div>
  <div id="instruction-distance">--</div>
 </div>

 <div id="bottom-stats" class="panel">
  <small>DISTANCE LEFT</small>
  <strong id="remaining">--</strong>
  <small>ESTIMATED TIME</small>
  <strong id="eta">--</strong>
 </div>

 <div id="map-box" class="panel">
  <div id="map"></div>
 </div>

 <button id="start" class="control" onclick="startNavigation()">
  ◉ START AR NAV
 </button>

 <button id="back" class="control" onclick="goBack()">
  ← BACK
 </button>

 <button id="zoom" class="control" onclick="changeZoom()">
  ZOOM
 </button>

 <button id="steps-button" class="control" onclick="toggleSteps()">
  ROUTE STEPS
 </button>

 <button id="reroute-button" class="control" onclick="reroute(true)">
  ↻ REROUTE
 </button>

 <button id="metrics-button" class="control" onclick="toggleMetrics()">
  METRICS
 </button>

 <div id="steps" class="panel"></div>

 <div id="metrics" class="panel">
  <div>Camera: <span id="m-camera">OFF</span></div>
  <div>GPS accuracy: <span id="m-gps">--</span></div>
  <div>Heading source: <span id="m-heading">--</span></div>
  <div>Position fixes: <span id="m-fixes">0</span></div>
  <div>Rejected fixes: <span id="m-rejected">0</span></div>
  <div>Reroutes: <span id="m-reroutes">0</span></div>
  <div>Off-route distance: <span id="m-offroute">--</span></div>
  <div>Camera FPS: <span id="m-fps">--</span></div>
  <div>Route state: <span id="m-route">Waiting</span></div>
 </div>

 <div id="status" role="status"></div>
</div>

<script>
"use strict";

/*
 CONFIGURATION

 Replace the placeholder with your restricted
 Google Maps JavaScript API key.

 The existing Directions API (Legacy) must be
 enabled in an eligible Google Cloud project.
*/
const GOOGLE_MAPS_API_KEY = "AIzaSyCh_SqXafoV8q-EEXifAaCGqWOeRi50jNA";

const CONFIG = {
 destination: "Vellore Institute of Technology",
 maxGPSAccuracy: 35,
 progressAccuracy: 25,
 waypointRadius: 14,
 arrivalRadius: 18,
 offRouteDistance: 45,
 offRouteSamples: 3,
 rerouteCooldownMs: 45000,
 minRerouteIntervalMs: 15000,
 maxPlausibleSpeed: 12,
 walkingSpeed: 1.3,
 cameraWidth: 1280,
 cameraHeight: 720
};

const $ = id => document.getElementById(id);

const state = {
 stream:null,
 track:null,
 started:false,
 cameraReady:false,
 zoomValues:[],
 zoomIndex:0,
 map:null,
 locationMarker:null,
 routeService:null,
 routeRenderer:null,
 routeSteps:[],
 routePath:[],
 currentStep:0,
 routeBusy:false,
 routingRequestId:0,
 routeReady:false,
 arrived:false,
 latitude:null,
 longitude:null,
 accuracy:Infinity,
 heading:null,
 headingSource:"Unavailable",
 headingQuality:false,
 orientationStarted:false,
 lastPosition:null,
 watchId:null,
 fixes:0,
 rejected:0,
 offRouteCount:0,
 offRouteDistance:null,
 reroutes:0,
 lastRerouteTime:0,
 fps:0,
 lastSpokenStep:-1,
 routeLength:0
};

let statusTimer=null;
let mapsPromise=null;

/* GENERAL HELPERS */
function statusMessage(message,duration=0){
 const box=$("status");
 clearTimeout(statusTimer);
 box.textContent=message;
 box.style.display="block";
 if(duration>0){
  statusTimer=setTimeout(()=>{
   if(box.textContent===message)
    box.style.display="none";
  },duration);
 }
}

function formatDistance(m){
 if(!Number.isFinite(m))return "--";
 return m>=1000?
  (m/1000).toFixed(1)+" km":
  Math.round(m)+" m";
}

function toRad(d){return d*Math.PI/180}
function toDeg(r){return r*180/Math.PI}
function normalize(d){return(d%360+360)%360}

function distanceMeters(a,b,c,d){
 const R=6371000;
 const x=toRad(c-a);
 const y=toRad(d-b);
 const h=Math.sin(x/2)**2+
  Math.cos(toRad(a))*Math.cos(toRad(c))*
  Math.sin(y/2)**2;
 return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

function bearingTo(a,b,c,d){
 const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
 const x=Math.cos(toRad(a))*Math.sin(toRad(c))-
  Math.sin(toRad(a))*Math.cos(toRad(c))*
  Math.cos(toRad(d-b));
 return normalize(toDeg(Math.atan2(y,x)));
}

function speak(message){
 if(!("speechSynthesis" in window))return;
 try{
  speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance(message);
  speech.lang="en-IN";
  speech.rate=1;
  speechSynthesis.speak(speech);
 }catch(error){
  console.warn("Voice error",error);
 }
}

/* CAMERA */
async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia)
  throw new Error("Camera unavailable. HTTPS is required.");

 let lastError;
 const options=[
  {audio:false,video:{
   facingMode:{ideal:"environment"},
   width:{ideal:CONFIG.cameraWidth},
   height:{ideal:CONFIG.cameraHeight}
  }},
  {audio:false,video:{facingMode:{ideal:"environment"}}}
 ];

 for(const option of options){
  try{
   state.stream=await navigator.mediaDevices.getUserMedia(option);
   break;
  }catch(error){lastError=error}
 }

 if(!state.stream)
  throw lastError||new Error("Could not open camera.");

 const video=$("camera");
 video.srcObject=state.stream;
 await video.play();

 state.track=state.stream.getVideoTracks()[0];
 state.cameraReady=true;

 $("m-camera").textContent=
  video.videoWidth+"x"+video.videoHeight;

 await setupZoom();
 startCameraFPS();
}

/* OPTIONAL CAMERA ZOOM */
async function setupZoom(){
 const track=state.track;
 if(!track?.getCapabilities)return;

 try{
  const cap=track.getCapabilities();
  if(!cap.zoom)return;

  const min=cap.zoom.min;
  const max=cap.zoom.max;

  state.zoomValues=[min,Math.max(min,Math.min(1,max)),max]
   .filter((v,i,a)=>
    a.findIndex(x=>Math.abs(x-v)<.001)===i);

  state.zoomIndex=0;

  await track.applyConstraints({
   advanced:[{zoom:state.zoomValues[0]}]
  });

  if(state.zoomValues.length>1){
   $("zoom").style.display="block";
   $("zoom").textContent=
    state.zoomValues[0].toFixed(1)+"×";
  }
 }catch(error){
  console.warn("Zoom unavailable:",error);
 }
}

async function changeZoom(){
 if(!state.track||!state.zoomValues.length)return;

 const next=(state.zoomIndex+1)%state.zoomValues.length;
 const value=state.zoomValues[next];

 try{
  await state.track.applyConstraints({
   advanced:[{zoom:value}]
  });
  state.zoomIndex=next;
  $("zoom").textContent=value.toFixed(1)+"×";
 }catch(error){
  statusMessage("Hardware zoom unavailable.",3000);
 }
}

function startCameraFPS(){
 const video=$("camera");
 let previous=0;
 let count=0;
 let start=performance.now();

 if(typeof video.requestVideoFrameCallback==="function"){
  function frame(now){
   if(!state.started&&!state.cameraReady)return;
   count++;
   if(now-start>=1000){
    state.fps=count*1000/(now-start);
    count=0;start=now;
    updateMetrics();
   }
   video.requestVideoFrameCallback(frame);
  }
  video.requestVideoFrameCallback(frame);
 }else{
  const timer=setInterval(()=>{
   if(!state.cameraReady){
    clearInterval(timer);return;
   }
   state.fps=0;
   $("m-fps").textContent="Unsupported";
  },1000);
 }
}

/* COMPASS
   Permission is requested directly from the
   button click before other awaited operations.
*/
async function setupOrientation(){
 if(state.orientationStarted)return;

 if(!window.DeviceOrientationEvent){
  $("m-heading").textContent="Not supported";
  return;
 }

 if(typeof DeviceOrientationEvent.requestPermission==="function"){
  try{
   let permission;
   try{
    permission=await DeviceOrientationEvent.requestPermission(true);
   }catch(error){
    permission=await DeviceOrientationEvent.requestPermission();
   }
   if(permission!=="granted"){
    $("m-heading").textContent="Permission denied";
    return;
   }
  }catch(error){
   console.warn("Compass permission:",error);
   $("m-heading").textContent="Permission denied";
   return;
  }
 }

 state.orientationStarted=true;

 window.addEventListener(
  "deviceorientationabsolute",handleOrientation,true
 );
 window.addEventListener(
  "deviceorientation",handleOrientation,true
 );
}

function handleOrientation(event){
 let value=null;
 let source=null;

 if(Number.isFinite(event.webkitCompassHeading)){
  value=event.webkitCompassHeading;
  source="iOS compass";
 }else if(event.absolute&&Number.isFinite(event.alpha)){
  value=360-event.alpha;
  source="Absolute orientation";
 }

 if(value===null)return;

 const next=normalize(value);

 if(state.heading!==null){
  let difference=normalize(next-state.heading+180)-180;
  if(Math.abs(difference)>100)return;
  state.heading=normalize(state.heading+difference*.25);
 }else{
  state.heading=next;
 }

 state.headingSource=source;
 state.headingQuality=true;

 $("heading").textContent=Math.round(state.heading)+"°";
 $("needle").style.transform=
  `rotate(${-state.heading}deg)`;

 $("m-heading").textContent=source;
 updateArrow();
}

/* START NAVIGATION */
async function startNavigation(){
 if(state.started)return;
 const button=$("start");
 button.disabled=true;

 if(!window.isSecureContext){
  statusMessage("Open this page over HTTPS.");
  button.disabled=false;
  return;
 }

 /*
  Start orientation permission immediately,
  while the button gesture is active.
 */
 const orientationPromise=setupOrientation();

 try{
  statusMessage("Opening rear camera...");
  await openCamera();
  state.started=true;
  button.style.display="none";

  $("metrics-button").style.display="block";
  $("reroute-button").style.display="block";

  await orientationPromise;

  statusMessage("Camera active. Obtaining GPS...",3500);

  if(!navigator.geolocation){
   statusMessage("GPS unavailable. Camera is active.");
   return;
  }

  navigator.geolocation.getCurrentPosition(
   async position=>{
    if(!acceptPosition(position))return;
    try{
     await loadGoogleMaps();
     initializeMap();
     calculateRoute(false);
     startGPSWatch();
    }catch(error){
     statusMessage(
      "Maps unavailable: "+error.message
     );
     startGPSWatch();
    }
   },
   error=>{
    statusMessage("GPS error: "+error.message);
   },
   {enableHighAccuracy:true,timeout:20000,maximumAge:0}
  );

 }catch(error){
  console.error(error);
  statusMessage("Camera failed: "+error.message);
  button.disabled=false;
  button.style.display="block";
  stopCamera();
  state.started=false;
 }
}

/* GOOGLE MAPS LOADER */
function loadGoogleMaps(){
 if(window.google?.maps)return Promise.resolve();
 if(mapsPromise)return mapsPromise;

 if(GOOGLE_MAPS_API_KEY==="YOUR_GOOGLE_MAPS_API_KEY"){
  return Promise.reject(new Error(
   "Set GOOGLE_MAPS_API_KEY in Navigation.html."
  ));
 }

 mapsPromise=new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  const timeout=setTimeout(()=>{
   reject(new Error("Google Maps loading timed out."));
  },15000);

  script.src="https://maps.googleapis.com/maps/api/js?key="+
   encodeURIComponent(GOOGLE_MAPS_API_KEY);

  script.async=true;
  script.onload=()=>{
   clearTimeout(timeout);
   if(window.google?.maps)resolve();
   else reject(new Error("Maps API did not initialize."));
  };
  script.onerror=()=>{
   clearTimeout(timeout);
   reject(new Error("Unable to load Google Maps."));
  };
  document.head.appendChild(script);
 }).catch(error=>{
  mapsPromise=null;
  throw error;
 });

 return mapsPromise;
}

function initializeMap(){
 if(state.map||!window.google?.maps)return;

 const position={
  lat:state.latitude,lng:state.longitude
 };

 state.map=new google.maps.Map($("map"),{
  center:position,zoom:17,disableDefaultUI:true
 });

 state.locationMarker=new google.maps.Marker({
  map:state.map,position,title:"Your location"
 });

 state.routeService=new google.maps.DirectionsService();

 state.routeRenderer=new google.maps.DirectionsRenderer({
  suppressMarkers:false,
  polylineOptions:{
   strokeColor:"#00ffe7",
   strokeWeight:5
  }
 });

 state.routeRenderer.setMap(state.map);
 $("map-box").style.display="block";
}

/* ROUTING */
function calculateRoute(isReroute){
 if(!state.routeService||
    state.latitude===null||
    state.routeBusy)return;

 state.routeBusy=true;
 const requestId=++state.routingRequestId;

 $("m-route").textContent="Calculating";

 statusMessage(isReroute?
  "Recalculating walking route...":
  "Calculating walking route...");

 const origin={
  lat:state.latitude,lng:state.longitude
 };

 state.routeService.route({
  origin,
  destination:CONFIG.destination,
  travelMode:google.maps.TravelMode.WALKING
 },(result,status)=>{

  if(requestId!==state.routingRequestId)return;
  state.routeBusy=false;

  if(status!=="OK"||!result?.routes?.[0]?.legs?.[0]){
   $("m-route").textContent="Error: "+status;
   statusMessage("Route error: "+status);
   return;
  }

  const route=result.routes[0];
  const leg=route.legs[0];

  state.routeRenderer.setDirections(result);

  state.routeSteps=leg.steps.map(step=>({
   text:stripHTML(step.instructions),
   start:{
    lat:step.start_location.lat(),
    lng:step.start_location.lng()
   },
   end:{
    lat:step.end_location.lat(),
    lng:step.end_location.lng()
   },
   distance:step.distance.value
  }));

  state.routePath=(route.overview_path||[]).map(p=>({
   lat:p.lat(),lng:p.lng()
  }));

  state.currentStep=0;
  state.routeReady=state.routeSteps.length>0;
  state.arrived=false;
  state.offRouteCount=0;
  state.lastSpokenStep=-1;
  state.routeLength=leg.distance.value;

  if(isReroute)state.reroutes++;

  $("arrow-area").style.display="block";
  $("instruction").style.display="block";
  $("bottom-stats").style.display="block";
  $("steps-button").style.display="block";

  buildSteps();
  updateInstruction();
  updateArrow();

  $("m-route").textContent="Active";
  statusMessage(
   isReroute?"Route updated.":"Navigation started.",
   3000
  );

  speak(state.routeSteps[0]?.text||"Navigation started.");
  updateMetrics();
 });
}

function stripHTML(html){
 const element=document.createElement("div");
 element.innerHTML=html;
 return element.textContent||"Proceed along the route.";
}

async function reroute(manual=false){
 if(!state.started||state.latitude===null){
  statusMessage("GPS position is unavailable.",3000);
  return;
 }

 if(state.routeBusy)return;

 const now=Date.now();

 if(!manual&&
  now-state.lastRerouteTime<CONFIG.rerouteCooldownMs)return;

 if(manual&&
  now-state.lastRerouteTime<CONFIG.minRerouteIntervalMs){
  statusMessage("Please allow time before rerouting again.",3000);
  return;
 }

 try{
  await loadGoogleMaps();
  initializeMap();
 }catch(error){
  statusMessage("Maps unavailable: "+error.message);
  return;
 }

 state.lastRerouteTime=Date.now();
 calculateRoute(true);
}

/* GPS */
function acceptPosition(position){
 const c=position.coords;
 if(!Number.isFinite(c.latitude)||
    !Number.isFinite(c.longitude))return false;

 state.fixes++;
 const accuracy=c.accuracy;

 $("gps").textContent=
  c.latitude.toFixed(4)+", "+c.longitude.toFixed(4);
 $("accuracy").textContent=Math.round(accuracy)+"m";
 state.accuracy=accuracy;

 if(!Number.isFinite(accuracy)||
    accuracy>CONFIG.maxGPSAccuracy){
  state.rejected++;
  updateMetrics();
  return false;
 }

 const timestamp=position.timestamp||Date.now();

 if(state.lastPosition){
  const d=distanceMeters(
   state.lastPosition.lat,state.lastPosition.lng,
   c.latitude,c.longitude
  );
  const seconds=Math.max(
   .1,(timestamp-state.lastPosition.time)/1000
  );

  const uncertainty=
   Math.max(accuracy,state.lastPosition.accuracy);

  if(seconds<20 &&
     d>uncertainty*2+CONFIG.maxPlausibleSpeed*seconds){
   state.rejected++;
   updateMetrics();
   return false;
  }
 }

 state.latitude=c.latitude;
 state.longitude=c.longitude;

 state.lastPosition={
  lat:c.latitude,lng:c.longitude,
  accuracy,time:timestamp
 };

 if(state.locationMarker){
  state.locationMarker.setPosition({
   lat:state.latitude,lng:state.longitude
  });
 }

 if(state.map){
  state.map.panTo({
   lat:state.latitude,lng:state.longitude
  });
 }

 if(state.routeReady&&!state.arrived){
  updateArrow();

  if(accuracy<=CONFIG.progressAccuracy){
   checkProgress();
   checkOffRoute();
  }
 }

 updateMetrics();
 return true;
}

function startGPSWatch(){
 if(state.watchId!==null)return;

 state.watchId=navigator.geolocation.watchPosition(
  acceptPosition,
  error=>statusMessage("GPS: "+error.message,4000),
  {enableHighAccuracy:true,maximumAge:1000,timeout:15000}
 );
}

/* ROUTE DISTANCE */
function updateArrow(){
 if(!state.routeReady||state.arrived||
  state.latitude===null)return;

 const step=state.routeSteps[state.currentStep];
 if(!step)return;

 const d=distanceMeters(
  state.latitude,state.longitude,
  step.end.lat,step.end.lng
 );

 $("arrow-distance").textContent=formatDistance(d);
 $("instruction-distance").textContent=
  formatDistance(d)+" to next waypoint";

 if(state.heading!==null){
  const target=bearingTo(
   state.latitude,state.longitude,
   step.end.lat,step.end.lng
  );

  let relative=normalize(target-state.heading+180)-180;

  /*
   This rotates an on-screen arrow.
   It is not a spatially anchored AR object.
  */
  $("main-arrow").style.transform=
   `rotate(${relative}deg)`;
 }else{
  $("main-arrow").style.transform="rotate(0deg)";
  $("instruction-distance").textContent+=
   " · Compass unavailable";
 }

 let remaining=d;

 for(let i=state.currentStep+1;
     i<state.routeSteps.length;i++){
  remaining+=state.routeSteps[i].distance;
 }

 $("remaining").textContent=formatDistance(remaining);
 $("eta").textContent=
  Math.ceil(remaining/CONFIG.walkingSpeed/60)+" min";
}

/* STEP PROGRESSION */
function checkProgress(){
 if(!state.routeReady||state.arrived)return;

 const step=state.routeSteps[state.currentStep];
 if(!step)return;

 const d=distanceMeters(
  state.latitude,state.longitude,
  step.end.lat,step.end.lng
 );

 const isFinal=
  state.currentStep===state.routeSteps.length-1;

 const radius=isFinal?
  CONFIG.arrivalRadius:CONFIG.waypointRadius;

 if(d>radius)return;

 if(isFinal){
  state.arrived=true;
  $("instruction-text").textContent="Destination reached!";
  $("instruction-distance").textContent="";
  $("arrow-area").style.display="none";
  $("remaining").textContent="0 m";
  $("eta").textContent="0 min";
  $("m-route").textContent="Arrived";
  speak("You have arrived at your destination.");
  return;
 }

 state.currentStep++;
 updateInstruction();
 updateArrow();

 if(state.lastSpokenStep!==state.currentStep){
  state.lastSpokenStep=state.currentStep;
  speak(state.routeSteps[state.currentStep].text);
 }
}

/* ROUTE DEVIATION
   Approximate point-to-polyline distance.
   Consecutive accurate fixes are required.
*/
function segmentDistanceMeters(p,a,b){
 const lat0=toRad(p.lat);
 const sx=111320*Math.cos(lat0);
 const sy=111320;

 const ax=(a.lng-p.lng)*sx;
 const ay=(a.lat-p.lat)*sy;
 const bx=(b.lng-p.lng)*sx;
 const by=(b.lat-p.lat)*sy;

 const dx=bx-ax,dy=by-ay;
 const len=dx*dx+dy*dy;

 const t=len===0?0:
  Math.max(0,Math.min(1,
   -(ax*dx+ay*dy)/len));

 return Math.hypot(ax+t*dx,ay+t*dy);
}

function distanceFromRoute(){
 if(state.latitude===null||state.routePath.length<2)
  return null;

 const p={lat:state.latitude,lng:state.longitude};
 let best=Infinity;

 for(let i=0;i<state.routePath.length-1;i++){
  best=Math.min(best,segmentDistanceMeters(
   p,state.routePath[i],state.routePath[i+1]
  ));
 }
 return best;
}

function checkOffRoute(){
 if(state.routeBusy||state.arrived)return;

 const distance=distanceFromRoute();
 if(distance===null)return;

 state.offRouteDistance=distance;

 if(distance>CONFIG.offRouteDistance){
  state.offRouteCount++;
 }else{
  state.offRouteCount=0;
 }

 if(state.offRouteCount>=CONFIG.offRouteSamples){
  state.offRouteCount=0;
  statusMessage("Possible route deviation. Rerouting...",3500);
  reroute(false);
 }
}

/* ROUTE STEP LIST */
function buildSteps(){
 const container=$("steps");
 container.replaceChildren();

 state.routeSteps.forEach((step,index)=>{
  const div=document.createElement("div");
  div.className="step"+(index===0?" active":"");
  div.textContent=(index+1)+". "+step.text;
  container.appendChild(div);
 });
}

function updateInstruction(){
 const step=state.routeSteps[state.currentStep];
 if(!step)return;

 $("instruction-text").textContent=step.text;

 document.querySelectorAll("#steps .step")
  .forEach((element,index)=>{
   element.classList.toggle(
    "active",index===state.currentStep
   );
  });
}

function toggleSteps(){
 const box=$("steps");
 box.style.display=
  box.style.display==="block"?"none":"block";
}

/* DIAGNOSTICS */
function toggleMetrics(){
 $("metrics").classList.toggle("visible");
 updateMetrics();
}

function updateMetrics(){
 $("m-gps").textContent=
  Number.isFinite(state.accuracy)?
   Math.round(state.accuracy)+" m":"--";

 $("m-fixes").textContent=state.fixes;
 $("m-rejected").textContent=state.rejected;
 $("m-reroutes").textContent=state.reroutes;

 $("m-offroute").textContent=
  state.offRouteDistance===null?"--":
  formatDistance(state.offRouteDistance);

 $("m-fps").textContent=
  state.fps?state.fps.toFixed(1):"--";
}

/* CLEANUP */
function stopCamera(){
 if(state.stream){
  state.stream.getTracks().forEach(t=>t.stop());
  state.stream=null;
 }
 state.cameraReady=false;
 state.track=null;
 $("camera").srcObject=null;
}

function cleanup(){
 if(state.watchId!==null){
  navigator.geolocation.clearWatch(state.watchId);
  state.watchId=null;
 }

 window.removeEventListener(
  "deviceorientationabsolute",handleOrientation,true
 );
 window.removeEventListener(
  "deviceorientation",handleOrientation,true
 );

 stopCamera();

 if("speechSynthesis" in window)
  speechSynthesis.cancel();
}

function goBack(){
 cleanup();
 window.location.href="home.html";
}

window.addEventListener("pagehide",cleanup);
</script>
</body>
</html>
