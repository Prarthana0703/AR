<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium AR Wedding Invite 💍</title>

    <!-- A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        /* Visual refresh only. AR camera, scene, and OCR remain unchanged. */
        :root { color-scheme: dark; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #invite-btn {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: max(18px, env(safe-area-inset-left));
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,.45);
            font-size: 25px;
            background: linear-gradient(145deg, #ff8eb9, #d83a7e);
            color: white;
            z-index: 999;
            box-shadow: 0 6px 22px rgba(81, 5, 46, .42);
            cursor: pointer;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        #invite-btn:active { transform: scale(.95); }
        #invite-btn:focus-visible { outline: 3px solid #ffe49a; outline-offset: 3px; }
        #invite-box {
            position: fixed;
            bottom: max(94px, calc(env(safe-area-inset-bottom) + 94px));
            left: max(18px, env(safe-area-inset-left));
            width: min(305px, calc(100vw - 36px));
            padding: 20px 20px 18px;
            background: linear-gradient(155deg, rgba(38, 18, 43, .96), rgba(17, 13, 29, .96));
            color: #fff8f3;
            border-radius: 18px;
            font-size: 14px;
            display: none;
            z-index: 999;
            border: 1px solid rgba(255, 215, 112, .78);
            line-height: 1.75;
            box-shadow: 0 14px 38px rgba(0, 0, 0, .45);
            backdrop-filter: blur(10px);
        }
        #invite-box::before {
            content: '💍  WEDDING INVITATION';
            display: block;
            margin-bottom: 10px;
            color: #ffe2a2;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }
        #invite-box p { margin: 0; }
        #invite-box b { color: #ffdca0; }
        #ocr-status {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: calc(100vw - 28px);
            padding: 10px 16px;
            background: rgba(28, 17, 38, .88);
            color: #fff3d6;
            border: 1px solid rgba(255, 217, 142, .72);
            border-radius: 999px;
            font-size: 12px;
            line-height: 1.4;
            font-weight: 600;
            z-index: 999;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .3);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        @media (max-width: 420px) {
            #invite-box { font-size: 13px; }
            #ocr-status { font-size: 11px; }
        }
    </style>
</head>

<body>

    <!-- Invitation Button -->
    <button id="invite-btn" type="button" aria-label="Show wedding invitation">
        💌
    </button>

    <div id="invite-box">
        <p>
            You are warmly invited to celebrate the wedding of
            <b>Rahul</b> &amp; <b>Saira</b>.
            Your presence will make this occasion truly special.
            💍<br><br>
            Please do come and bless us ❤️
        </p>
    </div>

    <div id="ocr-status">Initializing camera and OCR...</div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true; antialias: true"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <!-- Local assets: keep these files in the same folder -->
            <img id="bg" src="Background.png" crossorigin="anonymous">
            <img id="board" src="board.png" crossorigin="anonymous">
            <img id="marble" src="stage.png" crossorigin="anonymous">
            <img id="rose" src="rose_petal.png" crossorigin="anonymous">
            <img id="floor-texture" src="texture.jpg" crossorigin="anonymous">
            <img id="wood-texture" src="wood.jpg" crossorigin="anonymous">

            <!-- Wedding images -->
            <img id="p1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=500" crossorigin="anonymous">
            <img id="p2" src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=500" crossorigin="anonymous">
            <img id="p3" src="https://images.unsplash.com/photo-1465495910483-0d6745778503?w=500" crossorigin="anonymous">
            <img id="p4" src="https://images.unsplash.com/photo-1519225495810-7514194cba81?w=500" crossorigin="anonymous">
            <img id="p5" src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?w=500" crossorigin="anonymous">
        </a-assets>

        <!-- Lighting -->
        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="directional" position="1 4 1" intensity="1"></a-light>

        <!-- Audio controller -->
        <a-entity id="music"></a-entity>

        <!-- AR Marker -->
        <a-marker id="wedding-marker" preset="hiro">

            <!-- Background -->
            <a-entity
                geometry="primitive: cylinder; radius: 2; height: 3; thetaStart: 120; thetaLength: 120; openEnded: true"
                material="src: #bg; side: back; shader: flat; transparent: true; opacity: 1"
                position="0 0 -0.75">
            </a-entity>

            <!-- Circular floor -->
            <a-circle
                src="#floor-texture"
                rotation="-90 0 0"
                radius="1"
                position="0 0.01 0"
                material="roughness: 0.8; metalness: 0.1">
            </a-circle>

            <!-- Floor border -->
            <a-ring
                src="#wood-texture"
                radius-inner="0.95"
                radius-outer="1.05"
                rotation="-90 0 0"
                position="0 0.015 0"
                material="roughness: 0.6; metalness: 0.2">
            </a-ring>

            <!-- Floor shadow -->
            <a-circle
                color="#000"
                material="transparent: true; opacity: 0.2"
                radius="1.1"
                rotation="-90 0 0"
                position="0 0.005 0">
            </a-circle>

            <!-- Wedding gate: requires wedding_gate-v1.glb -->
            <a-entity
                gltf-model="wedding_gate-v1.glb"
                position="0 0 -0.8"
                scale="1.5 1.5 1.5">
            </a-entity>

            <!-- Wedding couple: requires couple.glb -->
            <a-entity
                gltf-model="couple.glb"
                position="0 1 0.2"
                scale="0.75 0.75 0.75"
                animation="property: rotation; to: 0 360 0; dur: 15000; easing: linear; loop: true">
            </a-entity>

            <!-- Wedding title -->
            <a-entity position="0 2.5 -0.5" look-at="[camera]">
                <a-text
                    value="RAHUL WEDS SAIRA"
                    align="center"
                    color="#FFD700"
                    width="5"
                    animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 1200; loop: true">
                </a-text>

                <a-text
                    value="RAHUL WEDS SAIRA"
                    align="center"
                    color="#000"
                    width="5"
                    opacity="0.4"
                    position="0.03 -0.03 -0.01">
                </a-text>
            </a-entity>

            <!-- Welcome board -->
            <a-plane
                src="#board"
                width="0.7"
                height="1.2"
                position="0.8 0.6 0.4"
                rotation="0 -20 0"
                material="transparent: true; alphaTest: 0.5; shader: flat"
                look-at="[camera]">
            </a-plane>

            <!-- Falling rose petals -->
            <a-entity id="petal-container">
                <a-plane src="#rose" position="-0.8 3 0"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: -0.8 0 0; dur: 4000; loop: true; easing: linear">
                </a-plane>

                <a-plane src="#rose" position="0.8 3.5 0.5"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: 0.8 0 0.5; dur: 5000; loop: true; easing: linear">
                </a-plane>

                <a-plane src="#rose" position="-0.3 4 -0.5"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear">
                </a-plane>

                <a-plane src="#rose" position="-0.6 2.3 0.1"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: -0.3 0 0.1; dur: 4500; loop: true; easing: linear">
                </a-plane>

                <a-plane src="#rose" position="-0.8 2.1 -0.7"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: -0.3 0 -0.5; dur: 4500; loop: true; easing: linear">
                </a-plane>

                <a-plane src="#rose" position="-0.1 3.2 -0.9"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: -0.1 0 -0.9; dur: 4500; loop: true; easing: linear">
                </a-plane>

                <a-plane src="#rose" position="-0.1 2.8 -1"
                    width="0.2" height="0.2"
                    material="transparent: true; side: double"
                    look-at="[camera]"
                    animation="property: position; to: -0.1 0 -1; dur: 4500; loop: true; easing: linear">
                </a-plane>
            </a-entity>

            <!-- Personalized guest name -->
            <a-text
                id="detected-name"
                value=""
                position="0 -0.8 1"
                align="center"
                color="#FF69B4"
                width="6"
                font="roboto"
                look-at="[camera]">
            </a-text>

            <!-- Personalized invitation message -->
            <a-text
                id="personal-msg"
                value="Present your guest name card to the camera"
                position="0 -1.3 1"
                align="center"
                color="#FFF5CC"
                width="4"
                font="roboto"
                look-at="[camera]">
            </a-text>

        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ==========================================
        // INVITATION AND MUSIC
        // ==========================================

        const inviteButton = document.getElementById("invite-btn");
        const inviteBox = document.getElementById("invite-box");
        const statusBox = document.getElementById("ocr-status");

        inviteButton.addEventListener("click", (event) => {
            event.stopPropagation();

            inviteBox.style.display =
                inviteBox.style.display === "block"
                    ? "none"
                    : "block";
        });

        let musicStarted = false;

        // Start music after the user's first interaction.
        document.addEventListener("pointerdown", function startMusic() {
            if (musicStarted) return;

            const music = document.querySelector("#music");

            if (music && music.components && music.components.sound) {
                music.components.sound.playSound();
            } else if (music) {
                music.setAttribute("sound", {
                    src: "url(wedding-music.mp3)",
                    autoplay: true,
                    loop: true,
                    volume: 0.7
                });
            }

            musicStarted = true;
        }, { once: true });

        // ==========================================
        // OCR STATE
        // ==========================================

        let processing = false;
        let nameDetected = false;
        let lastName = "";
        let scanTimer = null;

        // Ignore fixed text belonging to the AR invitation.
        const ignoredWords = new Set([
            "hiro", "marker", "camera", "welcome",
            "wedding", "invitation", "rahul", "saira",
            "weds", "gate", "please", "bless",
            "presence", "special", "celebrate", "warmly",
            "invite", "invited", "your", "name",
            "card", "present", "truly", "occasion",
            "make", "come", "dear", "scan", "scanning",
            "guest", "text", "real", "time", "pro",
            "prem", "premium", "message", "you", "are",
            "the", "and", "for", "this", "with",
            "from", "love", "john", "bride", "groom"
        ]);

        // ==========================================
        // NAME EXTRACTION
        // ==========================================

        function extractName(text) {
            const cleaned = text
                .replace(/[^a-zA-Z:\n ]/g, " ")
                .trim();

            if (!cleaned) return "";

            // Preferred format: GUEST NAME: Priya
            const labeledMatch = cleaned.match(
                /(?:GUEST\s*NAME|NAME)\s*:\s*([A-Za-z]{2,20})/i
            );

            if (labeledMatch) {
                const candidate = labeledMatch[1].trim();

                if (!ignoredWords.has(candidate.toLowerCase())) {
                    return candidate;
                }
            }

            // Fallback: first plausible standalone word.
            // This can mistake ordinary text for a name.
            const words = cleaned.split(/\s+/);

            for (const word of words) {
                const candidate = word.trim();

                if (
                    candidate.length >= 3 &&
                    candidate.length <= 20 &&
                    /^[A-Za-z]+$/.test(candidate) &&
                    !ignoredWords.has(candidate.toLowerCase())
                ) {
                    return candidate;
                }
            }

            return "";
        }

        // ==========================================
        // SPEECH
        // ==========================================

        function speakOnce(message) {
            if (!("speechSynthesis" in window)) {
                console.warn("Speech synthesis is not supported.");
                return;
            }

            // Avoid repeating a previously queued announcement.
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = "en-IN";
            utterance.rate = 0.9;
            utterance.pitch = 1;

            window.speechSynthesis.speak(utterance);
        }

        // ==========================================
        // OCR SCANNING
        // ==========================================

        function scheduleNextScan() {
            if (nameDetected || scanTimer !== null) return;

            scanTimer = window.setTimeout(() => {
                scanTimer = null;
                scan();
            }, 2500);
        }

        async function scan() {
            if (processing || nameDetected) return;

            processing = true;

            try {
                const video = document.querySelector("video");

                if (
                    !video ||
                    video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
                    !video.videoWidth ||
                    !video.videoHeight
                ) {
                    statusBox.textContent = "Waiting for camera...";
                    return;
                }

                statusBox.textContent = "Scanning for guest name...";

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d", {
                    willReadFrequently: true
                });

                // Resize large camera frames for faster OCR.
                const maxWidth = 960;
                const scale = Math.min(
                    1,
                    maxWidth / video.videoWidth
                );

                canvas.width = Math.round(video.videoWidth * scale);
                canvas.height = Math.round(video.videoHeight * scale);

                ctx.drawImage(
                    video,
                    0, 0,
                    canvas.width,
                    canvas.height
                );

                // Convert the image to grayscale.
                const imageData = ctx.getImageData(
                    0, 0,
                    canvas.width,
                    canvas.height
                );

                const pixels = imageData.data;

                for (let i = 0; i < pixels.length; i += 4) {
                    const gray = Math.round(
                        0.299 * pixels[i] +
                        0.587 * pixels[i + 1] +
                        0.114 * pixels[i + 2]
                    );

                    pixels[i] = gray;
                    pixels[i + 1] = gray;
                    pixels[i + 2] = gray;
                }

                ctx.putImageData(imageData, 0, 0);

                const result = await Tesseract.recognize(
                    canvas,
                    "eng",
                    {
                        logger: info => {
                            if (
                                info.status === "recognizing text" &&
                                typeof info.progress === "number"
                            ) {
                                statusBox.textContent =
                                    "Reading text: " +
                                    Math.round(info.progress * 100) + "%";
                            }
                        }
                    }
                );

                // Do not process the result if another operation
                // has already locked the detector.
                if (nameDetected) return;

                console.log("OCR recognized text:", result.data.text);

                const name = extractName(result.data.text);

                if (name && name !== lastName) {
                    // Lock first, before displaying or speaking.
                    // This prevents overlapping detections.
                    nameDetected = true;
                    lastName = name;

                    if (scanTimer !== null) {
                        clearTimeout(scanTimer);
                        scanTimer = null;
                    }

                    const displayMessage =
                        `Dear ${name},\n` +
                        `You are warmly invited to celebrate\n` +
                        `the wedding of Rahul & Saira.\n` +
                        `Please do come and bless us!`;

                    document.querySelector("#detected-name")
                        .setAttribute("value", name.toUpperCase());

                    document.querySelector("#personal-msg")
                        .setAttribute("value", displayMessage);

                    statusBox.textContent =
                        "Guest detected: " + name;

                    console.log("Name detected once:", name);

                    speakOnce(
                        `Dear ${name}, you are warmly invited ` +
                        `to the wedding of Rahul and Saira.`
                    );
                }

            } catch (error) {
                console.error("OCR error:", error);
                statusBox.textContent =
                    "OCR error. Check the browser console.";

            } finally {
                processing = false;

                // Continue only until the first successful detection.
                scheduleNextScan();
            }
        }

        // ==========================================
        // START OCR
        // ==========================================

        window.addEventListener("load", () => {
            statusBox.textContent =
                "Camera starting. Show the guest name card.";

            setTimeout(() => {
                scan();
            }, 3000);
        });
    </script>

</body>
</html>
